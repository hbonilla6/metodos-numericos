<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Interpolación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/interpolacion.css">
<link rel="stylesheet" href="css/hermite.css">
<link rel="stylesheet" href="css/spline.css">
</head>
<body>

<div class="wrap">
  <a class="volver" href="index.html">← Inicio</a>

  <div class="tabs" id="tabsRow">
    <button class="tab-btn activo" id="tab-lagrange" data-metodo="lagrange">Lineal / Lagrange</button>
    <button class="tab-btn" id="tab-hermite" data-metodo="hermite">Hermite</button>
    <button class="tab-btn" id="tab-spline" data-metodo="spline">Segmentaria</button>
  </div>

  <div class="card bajo-pestanas">
    <p class="nota-campos" id="notaCampos"></p>
    <div id="puntos"></div>
    <div class="btn-row">
      <button id="btnResolver">Resolver</button>
      <button id="btnLimpiar" class="secundario">Limpiar</button>
    </div>
  </div>

  <div id="statusBox"></div>

  <div class="card" id="tablaCard" style="display:none;">
    <h2 class="titulo-seccion">Tabla de diferencias divididas</h2>
    <div class="table-scroll">
      <table class="tabla-resultado" id="resultTable">
        <thead><tr id="headRow"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="explain" id="explainBox"></div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div id="pasos"></div>
  </div>

  <div class="card grafica-tarjeta" id="graficaCard">
    <h2>Gráfica</h2>
    <div id="grafica"></div>
    <div class="leyenda" id="graficaLeyenda"></div>
  </div>
</div>

<script src="js/comun/notacion.js"></script>
<script src="js/comun/algebra-exacta.js"></script>
<script src="js/comun/utilidades.js"></script>
<script src="js/comun/almacenamiento.js"></script>
<script src="js/comun/tabla-interactiva.js"></script>
<script src="js/comun/grafica.js"></script>
<script src="js/interpolacion/lagrange.js"></script>
<script src="js/interpolacion/presentacion.js"></script>
<script src="js/interpolacion/grafica.js"></script>
<script src="js/interpolacion/metodo.js"></script>
<script src="js/hermite/diferencias.js"></script>
<script src="js/hermite/estado.js"></script>
<script src="js/hermite/tabla.js"></script>
<script src="js/hermite/explicaciones.js"></script>
<script src="js/hermite/presentacion.js"></script>
<script src="js/hermite/grafica.js"></script>
<script src="js/hermite/metodo.js"></script>
<script src="js/spline/spline.js"></script>
<script src="js/spline/presentacion.js"></script>
<script src="js/spline/grafica.js"></script>
<script src="js/spline/metodo.js"></script>
<script src="js/interpolacion/pagina.js"></script>
</body>
</html>
