<div class="wrap">
  <a class="volver" href="index.html">← Inicio</a>

  <div class="tabs" id="tabsRow">
    <button class="tab-btn activo" id="tab-lagrange" data-metodo="lagrange">Lagrange</button>
    <button class="tab-btn" id="tab-hermite" data-metodo="hermite">Hermite</button>
    <button class="tab-btn" id="tab-spline" data-metodo="spline">Splite</button>

  </div>

  <div id="statusBox"></div>

  <div class="card" id="tablaCard" style="display:none;">

      <table class="tabla-resultado" id="resultTable">
        <thead><tr id="headRow"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="explain" id="explainBox"></div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div id="pasos"></div>
  </div>

  <div class="card grafica-tarjeta" id="graficaCard">
    <h2>Gráfica</h2>
    <div id="grafica"></div>
    <div class="leyenda" id="graficaLeyenda"></div>
  </div>
