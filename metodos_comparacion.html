<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Métodos numéricos, paso a paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=6d1c87ca">
<link rel="stylesheet" href="css/raices.css?v=e0f80ba6">
</head>
<body>

<div class="wrap">
  <a class="volver" href="index.html">← Inicio</a>

  <div class="card">
    <div class="field-row">
      <div class="field field-fx">
        <label for="fx">f(x)</label>
        <input id="fx" type="text" value="" placeholder="ej: 2*x^3 - x^2 - 3" autocomplete="off">
        <span class="hint">Usa * y ^ para potencias.</span>
      </div>
      <div class="field field-corto">
        <label for="a"><span id="labelA">a</span></label>
        <input id="a" type="text" value="" placeholder="ej: -1" autocomplete="off">
      </div>
      <div class="field field-corto" id="fieldB">
        <label for="b"><span id="labelB">b</span></label>
        <input id="b" type="text" value="" placeholder="ej: 2" autocomplete="off">
      </div>
      <div class="field field-tol">
        <label for="tol">Tolerancia</label>
        <input id="tol" type="text" value="1e-7" placeholder="ej: 1e-7" autocomplete="off">
      </div>
    </div>
    <div id="fxDisplay" class="fx-display"></div>
    <div id="derivDisplay" class="fx-display apoyo" style="display:none;"></div>

    <div class="btn-row">
      <button id="btnGenerar">Generar tabla</button>
      <button id="btnLimpiar" class="secundario">Limpiar</button>
    </div>
  </div>

  <div id="statusBox"></div>

  <div class="tabs" id="tabsRow">
    <button class="tab-btn activo" id="tabBisec">Bisección<span class="tab-iter" id="iterBisec"></span><span class="badge-rec" id="badgeBisec"><span class="badge-star">★</span></span></button>
    <button class="tab-btn" id="tabFalsa">Regla Falsa<span class="tab-iter" id="iterFalsa"></span><span class="badge-rec" id="badgeFalsa"><span class="badge-star">★</span></span></button>
    <button class="tab-btn" id="tabSecante">Secante<span class="tab-iter" id="iterSecante"></span><span class="badge-rec" id="badgeSecante"><span class="badge-star">★</span></span></button>
    <button class="tab-btn" id="tabNewton">Newton-Raphson<span class="tab-iter" id="iterNewton"></span><span class="badge-rec" id="badgeNewton"><span class="badge-star">★</span></span></button>
    <button class="tab-btn" id="tabPF">Punto Fijo<span class="tab-iter" id="iterPF"></span><span class="badge-rec" id="badgePF"><span class="badge-star">★</span></span></button>
  </div>

  <div class="card bajo-pestanas" id="tableCard" style="display:none;">
    <label class="opcion-error"><input type="checkbox" id="chkError" checked> Mostrar error</label>
    <div class="table-scroll">
      <table class="tabla-resultado" id="resultTable">
        <thead>
          <tr>
            <th>It</th>
            <th id="thA" class="col-a">a</th>
            <th id="thB" class="col-b">b</th>
            <th id="thFa" class="col-fa">f(a)</th>
            <th id="thFb" class="col-fb">f(b)</th>
            <th id="thXi" class="col-xi">xᵢ</th>
            <th id="thFxi" class="col-fxi">f(xᵢ)</th>
            <th class="col-error">Error</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="explain" id="explainBox"></div>
    <div id="finalAnswerBox"></div>
  </div>

  <div class="card grafica-tarjeta" id="graficaCard">
    <h2>Gráfica</h2>
    <div id="grafica"></div>
    <div class="leyenda" id="graficaLeyenda"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
<script src="js/comun/notacion.js?v=025c979a"></script>
<script src="js/comun/formato.js?v=db6ed112"></script>
<script src="js/comun/utilidades.js?v=cad8c034"></script>
<script src="js/comun/almacenamiento.js?v=248534f9"></script>
<script src="js/comun/tabla-interactiva.js?v=b415d11c"></script>
<script src="js/comun/grafica.js?v=3de5ee40"></script>
<script src="js/raices/expresion.js?v=ea6a42ab"></script>
<script src="js/raices/derivada.js?v=f77fe18b"></script>
<script src="js/raices/metodos.js?v=6f435f59"></script>
<script src="js/raices/punto-fijo.js?v=b3868e66"></script>
<script src="js/raices/formulas.js?v=5d8151e3"></script>
<script src="js/raices/estado.js?v=85d28286"></script>
<script src="js/raices/entrada.js?v=6becf1d4"></script>
<script src="js/raices/comparacion.js?v=47560061"></script>
<script src="js/raices/explicaciones.js?v=ed08f9da"></script>
<script src="js/raices/grafica.js?v=18ea5ec4"></script>
<script src="js/raices/tabla.js?v=a23a1690"></script>
<script src="js/raices/pagina.js?v=05740be9"></script>
</body>
</html>
