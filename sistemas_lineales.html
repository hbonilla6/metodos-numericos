<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sistemas de ecuaciones — Jacobi y Gauss-Seidel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sistemas.css">
</head>
<body>

<div class="wrap">
  <a class="volver" href="index.html">← Inicio</a>

  <div class="card">
    <p class="nota-campos">Deja vacío si el coeficiente es 1. Escribe 0 si esa variable no aparece. El número después del "=" sí es obligatorio. Para restar, escribe el coeficiente negativo (por ejemplo -2): abajo verás cómo queda tu sistema.</p>
    <div id="ecuaciones"></div>
    <div class="vista-previa" id="vistaPrevia" style="display:none;"></div>
    <div class="btn-row">
      <button id="btnResolver">Resolver</button>
      <button id="btnLimpiar" class="secundario">Limpiar</button>
    </div>
  </div>

  <div id="statusBox"></div>

  <div class="tabs" id="tabsRow">
    <button class="tab-btn activo" id="tabJacobi">Jacobi<span class="tab-iter" id="iterJacobi"></span><span class="badge-rec" id="badgeJacobi"><span class="badge-star">★</span></span></button>
    <button class="tab-btn" id="tabGauss">Gauss-Seidel<span class="tab-iter" id="iterGauss"></span><span class="badge-rec" id="badgeGauss"><span class="badge-star">★</span></span></button>
  </div>

  <div class="card bajo-pestanas" id="resultCard" style="display:none;">
    <div id="veredicto"></div>
    <div class="orden-box" id="ordenBox"></div>
    <label class="opcion-error"><input type="checkbox" id="chkError" checked> Mostrar error</label>
    <div class="table-scroll">
      <table class="tabla-resultado" id="resultTable">
        <thead><tr id="headRow"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="expandir-box" id="expandirBox"></div>
    <div class="explain" id="explainBox"></div>
    <div id="finalAnswerBox"></div>
  </div>

  <div class="card grafica-tarjeta" id="graficaCard">
    <h2>Gráfica</h2>
    <div id="grafica"></div>
    <div class="leyenda" id="graficaLeyenda"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
<script src="js/comun/notacion.js"></script>
<script src="js/comun/formato.js"></script>
<script src="js/comun/utilidades.js"></script>
<script src="js/comun/almacenamiento.js"></script>
<script src="js/comun/tabla-interactiva.js"></script>
<script src="js/comun/grafica.js"></script>
<script src="js/sistemas/matematica.js"></script>
<script src="js/sistemas/entrada.js"></script>
<script src="js/sistemas/estado.js"></script>
<script src="js/sistemas/despeje.js"></script>
<script src="js/sistemas/tabla.js"></script>
<script src="js/sistemas/explicaciones.js"></script>
<script src="js/sistemas/veredicto.js"></script>
<script src="js/sistemas/grafica.js"></script>
<script src="js/sistemas/pagina.js"></script>
</body>
</html>
