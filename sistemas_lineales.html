<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Sistemas de ecuaciones — Jacobi y Gauss-Seidel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
<style>
  :root{

  *{ box-sizing: border-box; }

  body{
    margin:0;
    overflow-x: hidden;

    color: var(--ink);

  }
  .wrap{ max-width: 900px; width: 100%; margin: 0 auto; }

  a.volver{
    display: inline-block; margin-bottom: 14px;
    font-weight: 600; font-size: 0.92rem; text-decoration: none;
    color: var(--ink-soft); border-bottom: 1.5px dashed var(--ink-soft);
  }
  a.volver:hover{ color: var(--ink); border-bottom-color: var(--ink); }

    background: #fffdf8; border: 1px solid var(--line); border-radius: 4px;

    box-shadow: 2px 2px 0 rgba(34,58,94,0.05);
  }

  .eq-row{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom: 12px; font-family:'Literata',serif; font-size: 1.05rem; }
  .eq-row:last-child{ margin-bottom: 0; }
  .eq-num{ color: var(--muted); font-size: 0.8rem; width: 16px; flex: 0 0 auto; }
  input.coef{
    width: 56px; text-align: center;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 1rem;
    padding: 7px 4px;

  }
  input.coef:focus{ outline: none; border-color: var(--ink); }
  input.input-flash{ animation: flashInput 1.1s ease-in-out; }
  @keyframes flashInput{
    0%, 100% { box-shadow: none; border-color: var(--line); }
    30% { box-shadow: 0 0 0 3px rgba(178,58,52,0.25); border-color: var(--red); }
  }
  .var-label{ font-style: italic; }
  .op{ color: var(--muted); }

  .vista-previa{
    font-family: 'Literata', serif; font-size: 1.15rem; line-height: 1.9;

  .vista-previa .vp-titulo{ display:block; font-family:'Source Sans 3',sans-serif; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
  .vista-previa .vp-fila{ white-space: nowrap; }

  .opcion-error{ display:inline-flex; align-items:center; gap:6px; margin: 0 0 10px; font-size:0.9rem; color:var(--ink-soft); cursor:pointer; user-select:none; }

  .btn-row{ display:flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button{

  #statusBox .status{ font-size: 0.95rem; padding: 10px 14px; border-radius: 3px; margin-bottom: 16px; }

  .tabs{ display:flex; gap:6px; border-bottom: 2px solid var(--line); overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tab-btn{
    background: transparent; color: var(--ink-soft); border: none; border-radius: 4px 4px 0 0;

  .expandir-box{ margin-top: 10px; text-align: center; }
  .expandir-box button{ background: #fffdf8; color: var(--ink); border: 1.5px dashed var(--ink-soft); }
  .expandir-box button:hover{ background: #f2efe6; }

  td.ref-highlight{ animation: pulseScale 0.55s ease-in-out 2; }
  @keyframes pulseScale{ 0%, 100% { outline-width: 2px; } 50% { outline-width: 4px; } }

  tr.final-row td.selected{ background: #cfe4d8 !important; }
  td.celda-raiz{ background: var(--gold) !important; color: #fff !important; font-weight: 700; }
  td.celda-raiz.selected{ background: #85600c !important; }

  .ref-link{ cursor: pointer; border-bottom: 1.5px dotted currentColor; padding: 0 1px; font-weight: 700; }
  .ref-link:hover{ filter: brightness(0.85); }
  .input-link{
    cursor: pointer; color: var(--ink-soft);
    border-bottom: 1.5px dashed var(--ink-soft); padding: 0 1px; font-weight: 700;

  .run-brace-char{

  .explain{
    margin-top: 18px; padding: 18px 20px; background: #fff;

  .explain .empty{ color: var(--muted); font-style: italic; }
  .explain p{ margin: 6px 0; }
  .formula{ font-family: 'Literata', serif; font-size: 1.08rem; color: var(--ink); line-height: 1.9; margin: 8px 0; overflow-x: auto; }
  .formula + .formula{ margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .formula-etq{ font-family:'Source Sans 3',sans-serif; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); display:block; line-height: 1.3; }

  .frac{
    display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center;
    margin: 0 5px; font-size: 0.92em; line-height: 1.3; position: relative; top: 0.15em;
  }
  .frac .frac-num{ display: block; padding: 0 5px 3px; border-bottom: 1.5px solid currentColor; }
  .frac .frac-den{ display: block; padding: 3px 5px 0; }

  .final-answer{
    margin-top: 16px; padding: 14px 18px; background: var(--green-soft);
    border: 1.5px solid var(--green); border-radius: 4px; font-size: 1.05rem; color: #275c3d;

  @media (max-width: 460px){

    th, td{ padding: 5px 7px; font-size: 0.82rem; }
    td.clickable{ padding: 5px 7px; }
    .explain{ padding: 12px 14px; font-size: 0.92rem; }

  }
  @media (max-width: 300px){

  }
  @media (shape: round){
    body{ padding: 20% 15%; text-align:center; }
    .eq-row{ justify-content: center; }
  }
</style>

<body>

<div class="wrap">
  <a class="volver" href="index.html">← Inicio</a>

  <div class="card">
    <p style="font-size:0.85rem; color:var(--muted); margin:0 0 10px;">Deja vacío si el coeficiente es 1. Escribe 0 si esa variable no aparece. El número después del "=" sí es obligatorio. Para restar, escribe el coeficiente negativo (por ejemplo -2): abajo verás cómo queda tu sistema.</p>
    <div id="ecuaciones"></div>
    <div class="vista-previa" id="vistaPrevia" style="display:none;"></div>
    <div class="btn-row">
      <button onclick="actualizarTodo()">Resolver</button>
      <button class="secundario" onclick="limpiarTodo()">Limpiar</button>
    </div>
  </div>

  <div id="statusBox"></div>

  <div class="tabs" id="tabsRow">
    <button class="tab-btn activo" id="tabJacobi" onclick="cambiarMetodo('jacobi')">Jacobi<span class="tab-iter" id="iterJacobi"></span><span class="badge-star" id="badgeJacobi">★</span></button>
    <button class="tab-btn" id="tabGauss" onclick="cambiarMetodo('gauss')">Gauss-Seidel<span class="tab-iter" id="iterGauss"></span><span class="badge-star" id="badgeGauss">★</span></button>
  </div>

  <div class="card" id="resultCard" style="display:none; border-top-left-radius:0;">
    <div id="veredicto"></div>
    <div class="orden-box" id="ordenBox"></div>
    <label class="opcion-error"><input type="checkbox" id="chkError" checked onchange="aplicarMostrarError()"> Mostrar error</label>
    <div class="table-scroll">
      <table id="resultTable">
        <thead><tr id="headRow"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="expandir-box" id="expandirBox"></div>
    <div class="explain" id="explainBox"></div>
    <div id="finalAnswerBox"></div>
  </div>
</div>

<script>
  Decimal.set({ precision: 40 });

  const N = 3; // 3 ecuaciones, 3 incógnitas: x, y, z
  const NOMBRES_VAR = ['x', 'y', 'z'];
  const MAX_IT = 150;       // tope absoluto mientras los valores sigan acercándose
  const ITER_CONTROL = 15;  // regla del profesor: en la iteración 15 se revisa si los valores se están acercando; si no, nos damos por vencidos
  const MOSTRAR_TODO_HASTA = 25; // si la respuesta aparece hasta esta iteración, se muestra completa; si tarda más, se pliega a ITER_CONTROL con botón para expandir
  const TOL = new Decimal('1e-7');
  const FIELD_ORDER = ['v0', 'v1', 'v2', 'error'];

  let metodoActual = 'jacobi';
  let modoManual = false;
  let filasTabla = [];      // incluye la fila 0 (valores iniciales); el índice coincide con la iteración
  let resActual = null;     // { Ar, br, perm, estado }
  let adjacency = {};

  function construirGridEcuaciones(){
    const cont = document.getElementById('ecuaciones');
    let html = '';
    for (let i = 0; i < N; i++){
      html += '<div class="eq-row">';
      html += '<span class="eq-num">(' + (i+1) + ')</span>';
      for (let j = 0; j < N; j++){
        html += '<input class="coef" id="a' + i + j + '" placeholder="1" autocomplete="off">';
        html += '<span class="var-label">' + NOMBRES_VAR[j] + '</span>';
        html += '<span class="op">' + (j < N - 1 ? '+' : '=') + '</span>';
      }
      html += '<input class="coef" id="b' + i + '" placeholder="0" autocomplete="off">';
      html += '</div>';
    }
    cont.innerHTML = html;
  }

  // --- Formato de números --------------------------------------------------

  // 3.0000000000 -> 3 ; 0.5000 -> 0.5 ; números diminutos en notación científica
  function fmt(d){
    if (d === null || d === undefined) return '—';
    if (!d.isZero() && d.isFinite() && d.abs().lessThan('1e-10')){
      const exp = d.e;
      const mant = d.dividedBy(new Decimal(10).pow(exp)).toDecimalPlaces(4).toString();
      return mant + ' × 10<sup>' + String(exp).replace('-', '−') + '</sup>';
    }
    let s = d.toFixed(10);
    if (s.includes('.')){ s = s.replace(/0+$/, ''); s = s.replace(/\.$/, ''); }
    if (s === '-0' || s === '') s = '0';
    return s.replace('-', '−');
  }

  function anotarRepeticiones(numStr){
    let out = '';
    let i = 0;
    while (i < numStr.length){
      const c = numStr[i];
      if (/[0-9]/.test(c)){
        let j = i;
        while (j < numStr.length && numStr[j] === c) j++;
        const largo = j - i;
        const digitos = c.repeat(largo);
        out += largo >= 2
          ? '<span class="run-brace-char">' + digitos + '<span class="run-count">' + largo + '</span></span>'
          : digitos;
        i = j;
      } else {
        out += c;
        i++;
      }
    }
    return out;
  }
  function fmtAnotado(d){
    const s = fmt(d);
    return s.indexOf('<sup>') >= 0 ? s : anotarRepeticiones(s);
  }
  // valor entre paréntesis si es negativo, para usarlo dentro de productos/sumas
  function conParen(d){ return d.isNegative() && !d.isZero() ? '(' + fmt(d) + ')' : fmt(d); }

  const SUBDIGITOS = { '0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉' };
  function aSubindice(n){
    return String(n).split('').map(d => SUBDIGITOS[d] !== undefined ? SUBDIGITOS[d] : d).join('');
  }

  function fraccion(numHtml, denHtml){
    return '<span class="frac"><span class="frac-num">' + numHtml + '</span><span class="frac-den">' + denHtml + '</span></span>';
  }

  // --- Motor matemático ----------------------------------------------------

  function generarPermutaciones(n){
    const indices = Array.from({ length: n }, (_, i) => i);
    const resultado = [];
    function permutar(actual, restantes){
      if (restantes.length === 0) { resultado.push(actual); return; }
      for (let i = 0; i < restantes.length; i++){
        const resto = restantes.slice(0, i).concat(restantes.slice(i + 1));
        permutar(actual.concat([restantes[i]]), resto);
      }
    }
    permutar([], indices);
    return resultado;
  }

  function puntajeDominancia(A, perm){
    const n = A.length;
    let estricta = true;
    let score = new Decimal(0);
    for (let v = 0; v < n; v++){
      const fila = A[perm[v]];
      const diag = fila[v].abs();
      let resto = new Decimal(0);
      for (let j = 0; j < n; j++) if (j !== v) resto = resto.plus(fila[j].abs());
      if (diag.lessThanOrEqualTo(resto)) estricta = false;
      score = score.plus(diag.minus(resto));
    }
    return { estricta, score };
  }

  function candidatosDeOrden(A){
    const perms = generarPermutaciones(A.length);
    const evaluadas = perms.map(perm => {
      const { estricta, score } = puntajeDominancia(A, perm);
      return { perm, estricta, score };
    });
    evaluadas.sort((a, b) => {
      if (a.estricta !== b.estricta) return a.estricta ? -1 : 1;
      return b.score.minus(a.score).toNumber();
    });
    return evaluadas;
  }

  function pasoJacobi(Ar, br, x){
    const n = Ar.length;
    const nuevo = x.slice();
    for (let i = 0; i < n; i++){
      let s = br[i];
      for (let j = 0; j < n; j++) if (j !== i) s = s.minus(Ar[i][j].times(x[j]));
      nuevo[i] = s.dividedBy(Ar[i][i]);
    }
    return nuevo;
  }

  function pasoGaussSeidel(Ar, br, x){
    const n = Ar.length;
    const nuevo = x.slice();
    for (let i = 0; i < n; i++){
      let s = br[i];
      for (let j = 0; j < n; j++) if (j !== i) s = s.minus(Ar[i][j].times(nuevo[j]));
      nuevo[i] = s.dividedBy(Ar[i][i]);
    }
    return nuevo;
  }

  function normaInfinito(a, b){
    let max = new Decimal(0);
    for (let i = 0; i < a.length; i++){
      const d = a[i].minus(b[i]).abs();
      if (d.greaterThan(max)) max = d;
    }
    return max;
  }

  function correrMetodoSistema(metodo, A, b, perm, tol, maxIt){
    const n = A.length;
    const Ar = perm.map(i => A[i]);
    const br = perm.map(i => b[i]);
    const paso = metodo === 'jacobi' ? pasoJacobi : pasoGaussSeidel;
    let x = Array.from({ length: n }, () => new Decimal(0));
    const filas = [];
    for (let it = 1; it <= maxIt; it++){
      let nuevo;
      try { nuevo = paso(Ar, br, x); } catch (e) { return { filas, estado: 'error', Ar, br }; }
      const diverge = nuevo.some(v => !v.isFinite() || v.abs().greaterThan('1e15'));
      if (diverge){
        filas.push({ it, x: nuevo, error: null, diverge: true });
        return { filas, estado: 'diverge', Ar, br };
      }
      const error = normaInfinito(nuevo, x);
      filas.push({ it, x: nuevo, error, diverge: false });
      x = nuevo;
      if (error.lessThan(tol)) return { filas, estado: 'convergio', Ar, br };
      if (it === ITER_CONTROL){
        // ¿el error de la iteración 15 es menor que el de la 12? Si no, no se acerca ni por cerca.
        const e12 = filas[it - 4].error;
        if (e12 !== null && !error.lessThan(e12)) return { filas, estado: 'diverge', sinAcercarse: true, Ar, br };
      }
    }
    return { filas, estado: 'maximo', Ar, br };
  }

  // Qué tan "cerca de funcionar" está un intento que no convergió: mejor uno que se quedó
  // corto (el error seguía bajando) que uno que realmente se disparó.
  function calidadNoConvergente(r){
    if (r.estado === 'maximo'){
      const ultima = r.filas[r.filas.length - 1];
      const err = ultima.error ? ultima.error.toNumber() : Infinity;
      return 1e6 - Math.min(err, 1e6 - 1);
    }
    if (r.estado === 'diverge') return -1e6;
    return -2e6;
  }

  // Un solo orden de ecuaciones compartido por ambos métodos (comparación justa).
  // Prioriza órdenes donde los DOS convergen; si no, donde converge al menos uno.
  function elegirOrdenCompartido(A, b, tol, maxIt){
    const candidatos = candidatosDeOrden(A);
    let mejorConvergente = null;
    let mejorRespaldo = null, mejorRespaldoCalidad = -Infinity;
    for (const c of candidatos){
      const rJacobi = correrMetodoSistema('jacobi', A, b, c.perm, tol, maxIt);
      const rGauss = correrMetodoSistema('gauss', A, b, c.perm, tol, maxIt);
      const jOk = rJacobi.estado === 'convergio';
      const gOk = rGauss.estado === 'convergio';
      const score = (jOk ? 1 : 0) + (gOk ? 1 : 0);
      if (score > 0){
        const info = { perm: c.perm, estricta: c.estricta, jacobi: rJacobi, gauss: rGauss };
        if (!mejorConvergente || score > (mejorConvergente.jacobi.estado==='convergio'?1:0)+(mejorConvergente.gauss.estado==='convergio'?1:0)){
          mejorConvergente = info;
        }
        if (score === 2){ mejorConvergente = info; break; }
      } else {
        const calidad = Math.max(calidadNoConvergente(rJacobi), calidadNoConvergente(rGauss));
        if (calidad > mejorRespaldoCalidad){
          mejorRespaldoCalidad = calidad;
          mejorRespaldo = { perm: c.perm, estricta: c.estricta, jacobi: rJacobi, gauss: rGauss };
        }
      }
    }
    return mejorConvergente || mejorRespaldo;
  }

  // --- Lectura de entradas / validación -----------------------------------

  function leerCampos(){
    const vals = {};
    for (let i = 0; i < N; i++){
      for (let j = 0; j < N; j++) vals['a'+i+j] = document.getElementById('a'+i+j).value;
      vals['b'+i] = document.getElementById('b'+i).value;
    }
    return vals;
  }

  function faltanCampos(vals){
    // Solo el término independiente es obligatorio; un coeficiente vacío vale 1.
    for (let i = 0; i < N; i++){
      if (!vals['b'+i] || !String(vals['b'+i]).trim()) return true;
    }
    return false;
  }

  function aDecimal(raw){ return new Decimal(String(raw).trim().replace(/[−–]/g, '-').replace(',', '.')); }

  function parsearSistema(vals){
    const A = [], b = [];
    for (let i = 0; i < N; i++){
      const fila = [];
      for (let j = 0; j < N; j++){
        const raw = vals['a'+i+j];
        fila.push((!raw || !String(raw).trim()) ? new Decimal(1) : aDecimal(raw));
      }
      A.push(fila);
      b.push(aDecimal(vals['b'+i]));
    }
    return { A, b };
  }

  function determinante3x3(A){
    const a=A[0][0], b=A[0][1], c=A[0][2];
    const d=A[1][0], e=A[1][1], f=A[1][2];
    const g=A[2][0], h=A[2][1], i=A[2][2];
    return a.times(e.times(i).minus(f.times(h)))
      .minus(b.times(d.times(i).minus(f.times(g))))
      .plus(c.times(d.times(h).minus(e.times(g))));
  }

  // Compara el determinante contra la escala típica de los coeficientes (al cubo).
  function esSingular(A){
    let maxEntrada = new Decimal(1);
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++){
      const v = A[i][j].abs();
      if (v.greaterThan(maxEntrada)) maxEntrada = v;
    }
    const det = determinante3x3(A);
    return det.abs().dividedBy(maxEntrada.pow(N)).lessThan('1e-8');
  }

  // Vista previa en formato matemático del sistema tal como está escrito en los campos
  function renderVistaPrevia(){
    const el = document.getElementById('vistaPrevia');
    const vals = leerCampos();
    if (Object.values(vals).every(v => !String(v).trim())){ el.style.display = 'none'; el.innerHTML = ''; return; }
    const malo = txt => '<span class="vp-mal">' + String(txt).replace(/</g, '&lt;') + '</span>';
    let html = '<span class="vp-titulo">Tu sistema</span>';
    for (let i = 0; i < N; i++){
      let fila = '';
      for (let j = 0; j < N; j++){
        const raw = vals['a'+i+j];
        let neg = false, cuerpo;
        if (!raw || !String(raw).trim()){ cuerpo = ''; }
        else {
          try{
            const c = aDecimal(raw);
            if (c.isZero()) continue;
            neg = c.isNegative();
            cuerpo = c.abs().equals(1) ? '' : fmt(c.abs());
          }catch(e){ cuerpo = malo(raw); }
        }
        const termino = cuerpo + '<i>' + NOMBRES_VAR[j] + '</i>';
        fila += fila === '' ? (neg ? '−' : '') + termino : (neg ? ' − ' : ' + ') + termino;
      }
      if (fila === '') fila = '0';
      const rawB = vals['b'+i];
      let rhs;
      if (!rawB || !String(rawB).trim()) rhs = '<span class="vp-mal">?</span>';
      else { try{ rhs = fmt(aDecimal(rawB)); }catch(e){ rhs = malo(rawB); } }
      html += '<div class="vp-fila">' + fila + ' = ' + rhs + '</div>';
    }
    el.innerHTML = html;
    el.style.display = 'block';
  }

  function setStatus(msg, tipo){
    if (!msg || !tipo){ document.getElementById('statusBox').innerHTML = ''; return; }
    document.getElementById('statusBox').innerHTML = '<div class="status ' + tipo + '">' + msg + '</div>';
  }

  // --- Colores y referencias entre celdas ----------------------------------

  function hueForCell(campo, idx){
    const globalIndex = idx * FIELD_ORDER.length + FIELD_ORDER.indexOf(campo);
    return (globalIndex * 137.508) % 360;
  }
  function colorForCell(campo, idx){ return 'hsl(' + hueForCell(campo, idx).toFixed(1) + ', 68%, 38%)'; }
  function bgForCell(campo, idx, alpha){ return 'hsla(' + hueForCell(campo, idx).toFixed(1) + ', 68%, 38%, ' + alpha + ')'; }
  function nodeKey(campo, idx){ return campo + '_' + idx; }
  function addDep(nodo, dependeDe){
    if (!adjacency[nodo]) adjacency[nodo] = new Set();
    adjacency[nodo].add(dependeDe);
  }

  function construirAdjacencia(){
    adjacency = {};
    for (let idx = 1; idx < filasTabla.length; idx++){
      for (let v = 0; v < N; v++){
        for (let j = 0; j < N; j++){
          if (j === v) continue;
          const nueva = metodoActual === 'gauss' && j < v;
          addDep(nodeKey('v' + v, idx), nodeKey('v' + j, nueva ? idx : idx - 1));
        }
        addDep(nodeKey('error', idx), nodeKey('v' + v, idx));
        addDep(nodeKey('error', idx), nodeKey('v' + v, idx - 1));
      }
    }
  }

  function celdaId(campo, idx){
    const base = campo === 'error' ? 'E' : NOMBRES_VAR[parseInt(campo.slice(1))];
    return base + aSubindice(idx);
  }
  function ref(campo, idx){
    if (idx === 0) return '<span>' + celdaId(campo, idx) + '</span>'; // valor inicial: sin celda que enlazar
    return '<span class="ref-link" style="color:' + colorForCell(campo, idx) + ';" data-campo="' + campo + '" data-idx="' + idx + '">' + celdaId(campo, idx) + '</span>';
  }
  function refInput(inputId, etiqueta){
    return '<span class="input-link" data-input="' + inputId + '">' + etiqueta + '</span>';
  }

  function limpiarRelacionados(){
    document.querySelectorAll('#resultTable td.related').forEach(td => {
      td.classList.remove('related'); td.style.outline = ''; td.style.background = '';
    });
  }
  function limpiarResaltados(){
    document.querySelectorAll('#resultTable td.ref-highlight').forEach(x => {
      x.classList.remove('ref-highlight'); x.style.outline = ''; x.style.background = '';
    });
  }
  function tdDe(campo, idx){
    return document.querySelector('#resultTable td[data-campo="' + campo + '"][data-idx="' + idx + '"]');
  }

  function resaltarRelacionados(campo, idx){
    limpiarRelacionados();
    const rel = adjacency[nodeKey(campo, idx)];
    if (!rel) return;
    rel.forEach(otherKey => {
      const k = otherKey.lastIndexOf('_');
      const c = otherKey.substring(0, k);
      const i = parseInt(otherKey.substring(k + 1));
      const td = tdDe(c, i);
      if (td){
        td.classList.add('related');
        td.style.outline = '2px solid ' + colorForCell(c, i);
        td.style.background = bgForCell(c, i, 0.22);
      }
    });
  }

  function seleccionarCelda(campo, idx){
    document.querySelectorAll('#resultTable td.selected').forEach(x => x.classList.remove('selected'));
    document.querySelectorAll('#resultTable tr.fila-activa').forEach(x => x.classList.remove('fila-activa'));
    limpiarResaltados();
    limpiarRelacionados();
    const td = tdDe(campo, idx);
    if (td){
      td.classList.add('selected');
      if (td.parentElement) td.parentElement.classList.add('fila-activa');
      td.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
    resaltarRelacionados(campo, idx);
    mostrarExplicacion(campo, idx);
  }

  function resaltarCelda(campo, idx){
    limpiarResaltados();
    const td = tdDe(campo, idx);
    if (td){
      void td.offsetWidth;
      td.classList.add('ref-highlight');
      td.style.outline = '2px solid ' + colorForCell(campo, idx);
      td.style.background = bgForCell(campo, idx, 0.2);
      td.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  }

  function irAlInput(inputId){
    const el = document.getElementById(inputId);
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.remove('input-flash');
    void el.offsetWidth;
    el.classList.add('input-flash');
    el.focus({ preventScroll: true });
  }

  document.addEventListener('click', (e) => {
    const link = e.target.closest('.ref-link');
    if (link){ resaltarCelda(link.dataset.campo, parseInt(link.dataset.idx)); return; }
    const inputLink = e.target.closest('.input-link');
    if (inputLink) irAlInput(inputLink.dataset.input);
  });

  // --- Render: despeje, tabla y explicaciones ------------------------------

  // Une términos {neg, h}: el primero lleva "−" pegado, los demás " + " / " − ".
  function unirTerminos(partes){
    if (!partes.length) return '0';
    return partes.map((p, i) => i === 0 ? (p.neg ? '−' : '') + p.h : (p.neg ? ' − ' : ' + ') + p.h).join('');
  }

  // Términos del numerador al despejar la variable v de la fila reordenada.
  //   modo 'sim'  -> variables con su letra (x, y, z) y coeficientes enlazados a los campos
  //   modo 'ref'  -> variables como referencias a celdas (x₂, y₂…)
  //   modo 'num'  -> valores numéricos ya sustituidos
  function terminosDespeje(v, modo, idx){
    const { Ar, br, perm } = resActual;
    const orig = perm[v], fila = Ar[v], b = br[v];
    const partes = [];
    let numerador = b;
    const hayOtros = fila.some((c, j) => j !== v && !c.isZero());
    if (!b.isZero() || !hayOtros){
      partes.push({ neg: b.isNegative() && !b.isZero(), h: modo === 'sim' ? refInput('b' + orig, fmt(b.abs())) : fmt(b.abs()) });
    }
    for (let j = 0; j < N; j++){
      if (j === v || fila[j].isZero()) continue;
      const c = fila[j], abs = c.abs(), uno = abs.equals(1);
      const neg = c.greaterThan(0); // pasa restando si el coeficiente es positivo
      let cuerpo;
      if (modo === 'sim'){
        cuerpo = (uno ? '' : refInput('a' + orig + j, fmt(abs)) + '·') + '<i>' + NOMBRES_VAR[j] + '</i>';
      } else {
        const nueva = metodoActual === 'gauss' && j < v;
        const it = nueva ? idx : idx - 1;
        const coefTxt = uno ? '' : fmt(abs) + '·';
        cuerpo = modo === 'ref'
          ? coefTxt + ref('v' + j, it)
          : coefTxt + conParen(filasTabla[it].x[j]);
        numerador = numerador.minus(c.times(filasTabla[it].x[j]));
      }
      partes.push({ neg, h: cuerpo });
    }
    return { html: unirTerminos(partes), numerador };
  }

  function ecuacionHtml(v){
    const { Ar, br, perm } = resActual;
    const orig = perm[v], fila = Ar[v];
    let s = '';
    for (let j = 0; j < N; j++){
      const c = fila[j];
      if (c.isZero()) continue;
      const abs = c.abs();
      const coef = abs.equals(1) ? '' : refInput('a' + orig + j, fmt(abs));
      const neg = c.isNegative();
      s += s === '' ? (neg ? '−' : '') : (neg ? ' − ' : ' + ');
      s += coef + '<i>' + NOMBRES_VAR[j] + '</i>';
    }
    return (s || '0') + ' = ' + refInput('b' + orig, fmt(br[v]));
  }

  function renderOrden(estricta){
    const { Ar, perm } = resActual;
    let html = '<div class="orden-titulo">Despeje de cada variable</div>';
    for (let v = 0; v < N; v++){
      const t = terminosDespeje(v, 'sim');
      html += '<div class="formula"><i>' + NOMBRES_VAR[v] + '</i> = ' + fraccion(t.html, refInput('a' + perm[v] + v, fmt(Ar[v][v]))) +
              '<span class="orden-de">de la ecuación (' + (perm[v] + 1) + ')</span></div>';
    }
    if (!estricta){
      html += '<div class="aviso">Ningún orden de las ecuaciones logra diagonal estrictamente dominante, así que la convergencia no está garantizada.</div>';
    }
    return html;
  }

  function renderTabla(resultado){
    const thead = document.getElementById('headRow');
    thead.innerHTML = '<th>It</th>' + NOMBRES_VAR.map(v => '<th>' + v + '</th>').join('') + '<th class="col-error">Error</th>';

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    const ultimoIdx = filasTabla.length - 1;
    const plegar = ultimoIdx > MOSTRAR_TODO_HASTA;
    filasTabla.forEach((fila, idx) => {
      if (idx === 0) return; // los valores iniciales no se muestran como fila
      const tr = document.createElement('tr');
      if (plegar && idx > ITER_CONTROL) tr.classList.add('fila-extra');
      const esFinal = idx === ultimoIdx && resultado.estado === 'convergio';
      if (esFinal) tr.classList.add('final-row');
      let tds = '<td class="it-col">' + fila.it + '</td>';
      NOMBRES_VAR.forEach((v, j) => {
        tds += '<td class="clickable' + (esFinal ? ' celda-raiz' : '') + '" data-campo="v' + j + '" data-idx="' + idx + '">' + fmtAnotado(fila.x[j]) + '</td>';
      });
      tds += '<td class="clickable col-error" data-campo="error" data-idx="' + idx + '">' + (fila.error !== null ? fmtAnotado(fila.error) : '—') + '</td>';
      tr.innerHTML = tds;
      tbody.appendChild(tr);
    });

    document.querySelectorAll('#resultTable td.clickable').forEach(td => {
      td.addEventListener('click', () => seleccionarCelda(td.dataset.campo, parseInt(td.dataset.idx)));
    });

    // Se muestran las primeras ITER_CONTROL iteraciones; el resto se puede expandir
    document.getElementById('resultTable').classList.remove('expandida');
    const extra = ultimoIdx - ITER_CONTROL;
    const box = document.getElementById('expandirBox');
    if (plegar){
      box.innerHTML = '<button type="button" id="btnExpandir" onclick="alternarExpandir()">Ver ' + (extra === 1 ? 'la iteración restante (' : 'las ' + extra + ' iteraciones restantes (') + (ITER_CONTROL + 1) + '–' + ultimoIdx + ')</button>';
    } else {
      box.innerHTML = '';
    }
  }

  function alternarExpandir(){
    const tabla = document.getElementById('resultTable');
    const abierta = tabla.classList.toggle('expandida');
    const ultimoIdx = filasTabla.length - 1;
    const extra = ultimoIdx - ITER_CONTROL;
    document.getElementById('btnExpandir').textContent = abierta
      ? 'Mostrar solo las primeras ' + ITER_CONTROL
      : 'Ver ' + (extra === 1 ? 'la iteración restante (' : 'las ' + extra + ' iteraciones restantes (') + (ITER_CONTROL + 1) + '–' + ultimoIdx + ')';
  }

  function mostrarExplicacion(campo, idx){
    const r = filasTabla[idx];
    const miRef = ref(campo, idx);
    let html = '';

    if (campo === 'error'){
      if (idx === 0 || r.error === null){
        html = '<p class="empty">Sin error todavía: la fila 0 es solo el punto de partida.</p>';
      } else {
        const difs = NOMBRES_VAR.map((n, j) => '|' + ref('v' + j, idx) + ' − ' + ref('v' + j, idx - 1) + '|').join(', ');
        const nums = NOMBRES_VAR.map((n, j) => '|' + conParen(r.x[j]) + ' − ' + conParen(filasTabla[idx - 1].x[j]) + '|').join(', ');
        const vals = NOMBRES_VAR.map((n, j) => fmt(r.x[j].minus(filasTabla[idx - 1].x[j]).abs())).join(', ');
        html = '<div class="formula">' + miRef + ' = máx(' + difs + ')</div>' +
               '<div class="formula">' + miRef + ' = máx(' + nums + ')</div>' +
               '<div class="formula">' + miRef + ' = máx(' + vals + ') = ' + fmt(r.error) + '</div>' +
               (idx === 1 ? '<p>' + NOMBRES_VAR.map((n, j) => celdaId('v' + j, 0)).join(', ') + ' = 0: valores iniciales.</p>' : '') +
               '<p>Norma infinito: la mayor diferencia entre esta fila y la anterior, en cualquiera de las variables. El método se detiene cuando es menor que 10<sup>−7</sup>.</p>';
      }
    } else {
      const v = parseInt(campo.slice(1));
      if (idx === 0){
        html = '<div class="formula">' + miRef + ' = 0</div><p>Valor inicial: el método arranca con todas las incógnitas en 0.</p>';
      } else {
        const { Ar, perm } = resActual;
        const diag = Ar[v][v];
        const tSim = terminosDespeje(v, 'sim');
        const tRef = terminosDespeje(v, 'ref', idx);
        const tNum = terminosDespeje(v, 'num', idx);
        const denLink = refInput('a' + perm[v] + v, fmt(diag));
        html =
          '<div class="formula"><span class="formula-etq">Ecuación (' + (perm[v] + 1) + ')</span>' + ecuacionHtml(v) + '</div>' +
          '<div class="formula"><span class="formula-etq">Despejando ' + NOMBRES_VAR[v] + '</span><i>' + NOMBRES_VAR[v] + '</i> = ' + fraccion(tSim.html, denLink) + '</div>' +
          '<div class="formula"><span class="formula-etq">Sustituyendo celdas</span>' + miRef + ' = ' + fraccion(tRef.html, fmt(diag)) + '</div>' +
          '<div class="formula"><span class="formula-etq">Con sus valores</span>' + miRef + ' = ' + fraccion(tNum.html, fmt(diag)) + '</div>' +
          '<div class="formula">' + miRef + ' = ' + fraccion(fmt(tNum.numerador), fmt(diag)) + ' = ' + fmt(r.x[v]) + '</div>';

        if (idx === 1) html += '<p>' + NOMBRES_VAR.map((n, j) => celdaId('v' + j, 0)).join(', ') + ' = 0: son los valores iniciales, el punto de partida.</p>';
        if (metodoActual === 'jacobi'){
          html += '<p>Jacobi: todo se calcula únicamente con los valores de la iteración anterior (fila ' + (idx - 1) + ').</p>';
        } else {
          const nuevas = [], viejas = [];
          for (let j = 0; j < N; j++){
            if (j === v) continue;
            (j < v ? nuevas : viejas).push(ref('v' + j, j < v ? idx : idx - 1));
          }
          let txt = 'Gauss-Seidel: ';
          if (nuevas.length) txt += 'usa los valores ya actualizados en esta misma fila (' + nuevas.join(', ') + ')' + (viejas.length ? ' y los de la anterior (' + viejas.join(', ') + ').' : '.');
          else txt += 'todavía no hay valores nuevos en esta fila, así que usa los de la anterior (' + viejas.join(', ') + ').';
          html += '<p>' + txt + '</p>';
        }
      }
    }
    document.getElementById('explainBox').innerHTML = '<span class="tag">Celda ' + celdaId(campo, idx) + '</span>' + html;
  }

  // --- Flujo principal -------------------------------------------------------

  function limpiarSalida(){
    document.getElementById('statusBox').innerHTML = '';
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('finalAnswerBox').innerHTML = '';
    document.getElementById('explainBox').innerHTML = '';
    document.getElementById('veredicto').innerHTML = '';
    document.getElementById('expandirBox').innerHTML = '';
  }

  function generarTabla(){
    limpiarSalida();

    const vals = leerCampos();
    if (faltanCampos(vals)){ setStatus('', null); return; }

    let A, b;
    try{
      ({ A, b } = parsearSistema(vals));
    }catch(err){
      setStatus('Revisa que todos los coeficientes sean números válidos.', 'error');
      return;
    }

    if (esSingular(A)){
      setStatus('Este sistema no tiene solución única (el determinante es prácticamente 0): puede no tener solución, o tener infinitas. Revisa si alguna ecuación es combinación de las otras.', 'error');
      return;
    }

    const compartido = elegirOrdenCompartido(A, b, TOL, MAX_IT);
    if (!compartido){
      setStatus('No se pudo resolver este sistema.', 'error');
      return;
    }
    const resultado = metodoActual === 'jacobi' ? compartido.jacobi : compartido.gauss;
    resActual = { Ar: resultado.Ar, br: resultado.br, perm: compartido.perm, estado: resultado.estado };
    filasTabla = [{ it: 0, x: Array.from({ length: N }, () => new Decimal(0)), error: null, diverge: false }].concat(resultado.filas);

    construirAdjacencia();
    document.getElementById('ordenBox').innerHTML = renderOrden(compartido.estricta);
    renderTabla(resultado);
    document.getElementById('explainBox').innerHTML = '<p class="empty">Toca cualquier celda para ver cómo se calculó.</p>';
    document.getElementById('resultCard').style.display = 'block';

    const nombre = metodoActual === 'jacobi' ? 'Jacobi' : 'Gauss-Seidel';
    const ultima = filasTabla[filasTabla.length - 1];
    const ver = document.getElementById('veredicto');
    if (resultado.estado === 'convergio'){
      ver.innerHTML = '<div class="veredicto converge"><strong>Converge</strong> — ' + nombre + ' llegó a la tolerancia en ' + (filasTabla.length - 1) + ' iteraciones.' + (filasTabla.length - 1 > MOSTRAR_TODO_HASTA ? ' Se muestran las primeras ' + ITER_CONTROL + '; puedes expandir para ver el resto.' : '') + '</div>';
      const vector = NOMBRES_VAR.map((v, j) => v + ' ≈ <strong>' + fmt(ultima.x[j].toDecimalPlaces(6)) + '</strong>').join(',&nbsp;&nbsp;');
      document.getElementById('finalAnswerBox').innerHTML = '<div class="final-answer">' + vector + '</div>';
    } else if (resultado.estado === 'diverge'){
      const motivo = resultado.sinAcercarse
        ? 'en la iteración ' + ITER_CONTROL + ' los valores no se acercan a la solución (el error no baja, es ' + fmt(ultima.error) + ')'
        : 'los valores crecen sin control (se detuvo en la iteración ' + ultima.it + ')';
      ver.innerHTML = '<div class="veredicto diverge"><strong>Diverge</strong> — con ' + nombre + ' ' + motivo + '. Nos damos por vencidos aquí; ningún orden de las ecuaciones lo arregla.</div>';
    } else {
      ver.innerHTML = '<div class="veredicto lento"><strong>Converge, pero muy lento</strong> — tras ' + MAX_IT + ' iteraciones ' + nombre + ' sigue acercándose pero aún no llega a la tolerancia (error ' + fmt(ultima.error) + ').</div>';
    }
  }

  function calcularAmbos(){
    const vals = leerCampos();
    if (faltanCampos(vals)) return null;
    let A, b;
    try{ ({ A, b } = parsearSistema(vals)); } catch(e){ return null; }
    if (esSingular(A)) return null;
    const compartido = elegirOrdenCompartido(A, b, TOL, MAX_IT);
    if (!compartido) return null;
    return { jacobi: compartido.jacobi, gauss: compartido.gauss };
  }

  function actualizarContadoresYGanador(resultados){
    function iterTexto(r){
      if (!r) return '';
      if (r.estado !== 'convergio') return ' (—)';
      return ' (' + r.filas.length + ')';
    }
    document.getElementById('iterJacobi').textContent = resultados ? iterTexto(resultados.jacobi) : '';
    document.getElementById('iterGauss').textContent = resultados ? iterTexto(resultados.gauss) : '';

    let ganador = null;
    if (resultados){
      const jOk = resultados.jacobi && resultados.jacobi.estado === 'convergio';
      const gOk = resultados.gauss && resultados.gauss.estado === 'convergio';
      if (jOk && gOk) ganador = resultados.jacobi.filas.length <= resultados.gauss.filas.length ? 'jacobi' : 'gauss';
      else if (jOk) ganador = 'jacobi';
      else if (gOk) ganador = 'gauss';
    }
    document.getElementById('badgeJacobi').classList.toggle('show', ganador === 'jacobi');
    document.getElementById('badgeGauss').classList.toggle('show', ganador === 'gauss');
    return ganador;
  }

  function actualizarTodo(){
    const resultados = calcularAmbos();
    const ganador = actualizarContadoresYGanador(resultados);
    if (resultados && ganador && ganador !== metodoActual && !modoManual){
      cambiarMetodo(ganador, true);
    } else {
      generarTabla();
    }
  }

  function cambiarMetodo(metodo, esAutomatico){
    metodoActual = metodo;
    if (!esAutomatico) modoManual = true;
    document.getElementById('tabJacobi').classList.toggle('activo', metodo === 'jacobi');
    document.getElementById('tabGauss').classList.toggle('activo', metodo === 'gauss');
    generarTabla();
  }

  // --- Persistencia ---------------------------------------------------------

  const CLAVE_STORAGE = 'sistemasLineales_campos';
  const CLAVE_MOSTRAR_ERROR = 'sistemasLineales_mostrarError';
  // Mostrar / ocultar la columna de error (se recuerda en este navegador)
  function aplicarMostrarError(){
    const chk = document.getElementById('chkError');
    const tabla = document.getElementById('resultTable');
    tabla.classList.toggle('oculta-error', !chk.checked);
    try{ localStorage.setItem(CLAVE_MOSTRAR_ERROR, chk.checked ? '1' : '0'); }catch(e){}
  }
  function restaurarMostrarError(){
    try{ if (localStorage.getItem(CLAVE_MOSTRAR_ERROR) === '0') document.getElementById('chkError').checked = false; }catch(e){}
    aplicarMostrarError();
  }


  function idsCampos(){
    const ids = [];
    for (let i = 0; i < N; i++){
      for (let j = 0; j < N; j++) ids.push('a'+i+j);
      ids.push('b'+i);
    }
    return ids;
  }

  function guardarCampos(){
    try{
      const datos = {};
      idsCampos().forEach(id => { datos[id] = document.getElementById(id).value; });
      localStorage.setItem(CLAVE_STORAGE, JSON.stringify(datos));
    }catch(e){ /* sin almacenamiento: seguimos sin guardar */ }
  }

  function restaurarCampos(){
    try{
      const guardado = localStorage.getItem(CLAVE_STORAGE);
      if (!guardado) return false;
      const datos = JSON.parse(guardado);
      let hubo = false;
      idsCampos().forEach(id => {
        if (datos[id] !== undefined && datos[id] !== ''){
          document.getElementById(id).value = datos[id];
          hubo = true;
        }
      });
      return hubo;
    }catch(e){ return false; }
  }

  function limpiarTodo(){
    idsCampos().forEach(id => { document.getElementById(id).value = ''; });
    try{ localStorage.removeItem(CLAVE_STORAGE); }catch(e){}
    modoManual = false;
    limpiarSalida();
    renderVistaPrevia();
    actualizarContadoresYGanador(null);
    cambiarMetodo('jacobi', true);
  }

  let debounceActualizacion = null;
  function programarActualizacion(){
    clearTimeout(debounceActualizacion);
    debounceActualizacion = setTimeout(actualizarTodo, 500);
  }

  window.onload = function(){
    construirGridEcuaciones();
    idsCampos().forEach(id => {
      document.getElementById(id).addEventListener('input', () => { modoManual = false; guardarCampos(); renderVistaPrevia(); programarActualizacion(); });
    });
    restaurarCampos();
    restaurarMostrarError();
    renderVistaPrevia();
  };
</script>

</body>
</html>
