<body>

<div class="wrap">
  <a class="volver" href="index.html">← Inicio</a>

  <div class="card">
    <p class="nota-campos">Escribe cada punto con su valor f(x) y su derivada f'(x). Con 2 puntos el polinomio es de grado 3; con 3 puntos, de grado 5. El tercer punto es opcional.</p>
    <div id="puntos"></div>
    <div class="btn-row">
      <button id="btnResolver">Resolver</button>
      <button id="btnLimpiar" class="secundario">Limpiar</button>
    </div>
  </div>

  <div id="statusBox"></div>

  <div class="card" id="tablaCard" style="display:none;">
    <h2 class="titulo-seccion">Tabla de diferencias divididas</h2>
    <div class="table-scroll">
      <table class="tabla-resultado" id="resultTable">
        <thead><tr id="headRow"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="explain" id="explainBox"></div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div id="pasos"></div>
  </div>

  <div class="card grafica-tarjeta" id="graficaCard">
    <h2>Gráfica</h2>
    <div id="grafica"></div>
    <div class="leyenda" id="graficaLeyenda"></div>
  </div>
</div>
