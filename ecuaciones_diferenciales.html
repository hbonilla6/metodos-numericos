<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ecuaciones diferenciales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=fd38c182">
<link rel="stylesheet" href="css/resultados.css?v=01cff650">
</head>
<body>

<div class="wrap">
  <a class="volver" href="index.html">← Inicio</a>

  <div class="tabs" id="tabsRow">
    <button class="tab-btn activo" id="tab-euler" data-metodo="euler">Euler</button>
    <button class="tab-btn" id="tab-heun" data-metodo="heun">Heun (Euler mejorado)</button>
  </div>

  <div class="card bajo-pestanas">
    <div class="field-row">
      <div class="field field-fx">
        <label for="fxy">y' = f(x, y)</label>
        <input id="fxy" type="text" placeholder="ej: 2*x*y" autocomplete="off">
        <span class="hint">Usa x e y, * y ^, y funciones como sqrt, exp, sin, cos, tan, ln, e y pi.</span>
      </div>
    </div>
    <div class="field-row">
      <div class="field field-corto">
        <label for="x0">x₀</label>
        <input id="x0" type="text" placeholder="ej: 0" autocomplete="off">
      </div>
      <div class="field field-corto">
        <label for="y0">y₀ = y(x₀)</label>
        <input id="y0" type="text" placeholder="ej: 1" autocomplete="off">
      </div>
      <div class="field field-corto">
        <label for="xn">xₙ (dónde aproximar)</label>
        <input id="xn" type="text" placeholder="ej: 0.5" autocomplete="off">
      </div>
      <div class="field field-corto">
        <label for="n">Pasos n</label>
        <input id="n" type="text" inputmode="numeric" placeholder="ej: 5" autocomplete="off">
      </div>
    </div>
    <div class="field-row">
      <div class="field field-fx">
        <label for="exacta">Solución exacta y(x) (opcional)</label>
        <input id="exacta" type="text" placeholder="ej: e^(x^2)" autocomplete="off">
        <span class="hint">Si la escribes, la tabla muestra el error de cada aproximación.</span>
      </div>
    </div>
    <div id="fxDisplay" class="fx-display"></div>

    <div class="btn-row">
      <button id="btnResolver">Resolver</button>
      <button id="btnLimpiar" class="secundario">Limpiar</button>
    </div>
  </div>

  <div id="statusBox"></div>

  <div class="card" id="resultCard" style="display:none;">
    <div id="pasos"></div>
  </div>

  <div class="card grafica-tarjeta" id="graficaCard">
    <h2>Gráfica</h2>
    <div id="grafica"></div>
    <div class="leyenda" id="graficaLeyenda"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
<script src="js/comun/notacion.js?v=025c979a"></script>
<script src="js/comun/formato.js?v=28745c21"></script>
<script src="js/comun/utilidades.js?v=d649b291"></script>
<script src="js/comun/almacenamiento.js?v=248534f9"></script>
<script src="js/comun/grafica.js?v=3de5ee40"></script>
<script src="js/comun/expresion.js?v=3a53da28"></script>
<script src="js/comun/derivada.js?v=c789c39b"></script>
<script src="js/comun/formulas.js?v=4630be1e"></script>
<script src="js/edo/metodos.js?v=1e4286e9"></script>
<script src="js/edo/presentacion.js?v=bce24b3c"></script>
<script src="js/edo/grafica.js?v=0b80b2e5"></script>
<script src="js/edo/pagina.js?v=9d0c65d5"></script>
</body>
</html>
