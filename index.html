<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Métodos numéricos, paso a paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
<style>
  :root{
    --paper: #faf8f2;
    --line: #d9d5c7;
    --ink: #223a5e;
    --ink-soft: #4a5b7a;
    --red: #b23a34;
    --red-soft: #f3e0de;
    --green: #3f7d58;
    --green-soft: #e2ede5;
    --gold: #a1730f;
    --gold-soft: #f5ecd7;
    --muted: #7a7566;
  }

  *{ box-sizing: border-box; }

  html{ overflow-x: hidden; }

  body{
    margin:0;
    overflow-x: hidden;
    font-family: 'Source Sans 3', sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      repeating-linear-gradient(var(--line) 0 1px, transparent 1px 32px),
      repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 32px);
    background-size: 32px 32px;
    min-height: 100vh;
    padding: 32px 16px 80px;
  }

  .wrap{ max-width: 900px; width: 100%; margin: 0 auto; }

  h1{
    font-family: 'Literata', serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle{
    color: var(--ink-soft);
    margin: 0 0 24px;
    font-size: 1.02rem;
    max-width: 65ch;
  }

  .card{
    background: #fffdf8;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 22px 24px;
    margin-bottom: 20px;
    box-shadow: 2px 2px 0 rgba(34,58,94,0.05);
  }

  .field-row{ display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 14px; }
  .field{ flex: 1 1 160px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

  label{ font-size: 0.85rem; color: var(--ink-soft); font-weight: 600; }

  input{
    width: 100%;
    min-width: 0;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 1rem;
    padding: 9px 11px;
    border: 1.5px solid var(--line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
  }

  input:focus{ outline: none; border-color: var(--ink); }

  input.input-flash{ animation: flashInput 1.1s ease-in-out; }

  @keyframes flashInput{
    0%, 100% { box-shadow: none; border-color: var(--line); }
    30% { box-shadow: 0 0 0 3px rgba(178,58,52,0.25); border-color: var(--red); }
  }

  .input-link{
    cursor: pointer;
    color: var(--ink-soft);
    border-bottom: 1.5px dashed var(--ink-soft);
    padding: 0 1px;
    font-weight: 700;
  }
  .input-link:hover{ color: var(--ink); border-bottom-color: var(--ink); }

  .fx-display{
    font-family: 'Literata', serif;
    font-size: 1.25rem;
    text-align: center;
    padding: 12px 14px;
    margin-top: 10px;
    background: #f2efe6;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--ink);
    min-height: 1.6em;
    overflow-wrap: break-word; word-break: break-word;
  }

  .fx-token{ padding: 1px 3px; border-radius: 3px; transition: background 0.2s ease, color 0.2s ease; }
  .fx-token.token-flash{ background: var(--red); color: #fff; animation: tokenPulse 1.1s ease-in-out; }
  @keyframes tokenPulse{ 0%, 100% { transform: scale(1); } 30% { transform: scale(1.35); } }

  .hint{ font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

  button{
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    font-size: 0.98rem;
    padding: 11px 22px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover{ background: #16294a; }

  .btn-row{ display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }

  .badge-rec{ display: none; margin-left: 4px; vertical-align: middle; }
  .badge-rec.show{ display: inline-block; }
  .badge-rec .badge-star{
    font-size: 0.75rem; font-weight: 700; color: var(--gold);
  }
  .tab-iter{ font-size: 0.72em; opacity: 0.65; margin-left: 3px; font-weight: 500; }

  .status{ font-size: 0.95rem; padding: 10px 14px; border-radius: 3px; margin-bottom: 16px; }
  .status.error{ background: var(--red-soft); color: var(--red); border: 1px solid var(--red); }
  .status.success{ background: var(--green-soft); color: var(--green); border: 1px solid var(--green); }
  .status.info{ background: #fff; color: var(--ink-soft); border: 1px dashed var(--line); }

  .recomendacion{
    background: var(--gold-soft);
    border: 1.5px solid var(--gold);
    border-radius: 4px;
    padding: 16px 18px;
    margin-bottom: 16px;
    font-size: 0.98rem;
    line-height: 1.55;
  }
  .recomendacion h3{
    margin: 0 0 8px;
    font-family: 'Literata', serif;
    color: #6b4d09;
    font-size: 1.1rem;
  }
  .recomendacion table{
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 0.9rem;
  }
  .recomendacion th, .recomendacion td{
    border: 1px solid #e0cfa0;
    padding: 6px 10px;
    text-align: center;
  }
  .recomendacion th{ background: #eddfb8; }
  .recomendacion .ganador{ background: var(--green-soft); font-weight: 700; }
  .recomendacion .aviso{
    margin-top: 10px;
    padding: 8px 10px;
    background: #fff;
    border-left: 3px solid var(--red);
    font-size: 0.88rem;
    color: var(--ink-soft);
  }

  .tabs{
    display: flex;
    gap: 6px;
    margin-bottom: 0;
    border-bottom: 2px solid var(--line);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .tab-btn{
    background: transparent;
    color: var(--ink-soft);
    border: none;
    border-radius: 4px 4px 0 0;
    padding: 10px 18px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    margin-bottom: -2px;
    border-bottom: 2px solid transparent;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .tab-btn.activo{
    color: var(--ink);
    background: #fffdf8;
    border: 1px solid var(--line);
    border-bottom: 2px solid #fffdf8;
  }
  .tab-btn:hover:not(.activo){ background: #f2f0e8; color: var(--ink); }

  .table-scroll{ overflow-x: auto; }

  table.tabla-resultado{
    border-collapse: collapse; width: 100%;
    font-variant-numeric: tabular-nums; font-size: 0.92rem;
  }
  table.tabla-resultado th, table.tabla-resultado td{
    border: 1px solid var(--line); padding: 8px 10px; text-align: center; white-space: nowrap;
  }
  table.tabla-resultado th{
    background: #f2efe6; font-family: 'Literata', serif; font-weight: 600; color: var(--ink);
    position: sticky; top: 0;
  }

  td.clickable{ cursor: pointer; transition: background 0.12s ease; padding: 5px 10px; }
  td.clickable:hover{ background: #eef1f7; }

  #resultTable.oculta-b .col-b,
  #resultTable.oculta-fb .col-fb,
  #resultTable.oculta-fxi .col-fxi,
  #resultTable.oculta-xi .col-xi{ display: none; }

  td.selected{ background: #dde6f5 !important; outline: 2px solid var(--ink); outline-offset: -2px; }

  tr.fila-activa td{
    background: rgba(34, 58, 94, 0.055);
  }
  tr.fila-activa td.selected{
    background: #dde6f5 !important;
  }
  td.ref-highlight{ animation: pulseScale 0.55s ease-in-out 2; }
  @keyframes pulseScale{ 0%, 100% { outline-width: 2px; } 50% { outline-width: 4px; } }
  td.related{ transition: background 0.15s ease, outline 0.15s ease; }

  .ref-link{ cursor: pointer; border-bottom: 1.5px dotted currentColor; padding: 0 1px; font-weight: 700; }
  .ref-link:hover{ filter: brightness(0.85); }

  tr.final-row td{ background: var(--green-soft); }
  tr.final-row td.selected{ background: #cfe4d8 !important; }
  td.celda-raiz{
    background: var(--gold) !important;
    color: #fff !important;
    font-weight: 700;
  }
  td.celda-raiz.selected{ background: #85600c !important; }

  .it-col{ color: var(--muted); font-weight: 600; }

  .run-brace-char{
    position: relative;
    border-bottom: 1.3px solid var(--red);
    border-radius: 0 0 50% 50%;
    padding-bottom: 6px;
  }
  .run-count{
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    font-size: 0.5em;
    color: var(--red);
    font-weight: 700;
    line-height: 1;
  }

  .explain{
    margin-top: 18px; padding: 18px 20px; background: #fff;
    border: 1.5px dashed var(--ink); border-radius: 4px; min-height: 70px;
    font-size: 1rem; line-height: 1.55;
    overflow-wrap: break-word; word-break: break-word;
  }
  .explain .tag{
    display: inline-block; font-family: 'Literata', serif; font-weight: 700;
    color: var(--red); margin-bottom: 6px;
  }
  .formula{ font-family: 'Literata', serif; font-size: 1.08rem; color: var(--ink); line-height: 1.9; margin: 8px 0; }
  .formula + .formula{ margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .explain .empty{ color: var(--muted); font-style: italic; }

  .frac{
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    text-align: center;
    margin: 0 5px;
    font-size: 0.92em;
    line-height: 1.3;
    position: relative;
    top: 0.15em;
  }
  .frac .frac-num{
    display: block;
    padding: 0 5px 3px;
    border-bottom: 1.5px solid currentColor;
  }
  .frac .frac-den{
    display: block;
    padding: 3px 5px 0;
  }

  .raiz{
    display: inline-flex;
    align-items: flex-start;
    margin: 0 4px;
    vertical-align: middle;
  }
  .raiz .raiz-marca{
    display: inline-flex;
    align-items: flex-start;
  }
  .raiz .raiz-indice{
    font-size: 0.6em;
    line-height: 1;
    margin-right: 1px;
  }
  .raiz .raiz-signo{
    font-size: 1.25em;
    line-height: 1;
  }
  .raiz .raiz-cont{
    border-top: 1.5px solid currentColor;
    padding: 1px 3px 0;
  }

  .final-answer{
    margin-top: 16px; padding: 14px 18px; background: var(--green-soft);
    border: 1.5px solid var(--green); border-radius: 4px; font-size: 1.05rem; color: #275c3d;
  }
  .final-answer strong{ font-family: 'Literata', serif; font-size: 1.2rem; }

  @media (max-width: 560px){
    .card{ padding: 16px; }
    th, td{ padding: 6px 7px; font-size: 0.82rem; }
    .tab-btn{ padding: 9px 12px; font-size: 0.88rem; }
  }

  @media (max-width: 460px){
    body{ padding: 20px 10px 60px; }
    .card{ padding: 14px; }
    .field-row{ gap: 10px; }
    .field{ flex-basis: 100% !important; }
    h1{ font-size: 1.35rem; }
    .subtitle{ font-size: 0.92rem; }
    button{ padding: 10px 14px; font-size: 0.92rem; }
    .tab-btn{ padding: 8px 12px; font-size: 0.85rem; }
    .explain{ padding: 12px 14px; font-size: 0.92rem; }
    .frac{ font-size: 0.85em; margin: 0 3px; }
    .recomendacion{ padding: 12px 14px; font-size: 0.9rem; }
  }

  @media (max-width: 300px){
    body{ padding: 12px 6px 40px; background-size: 20px 20px; }
    h1{ font-size: 1.05rem; }
    .subtitle{ display: none; }
    .card{ padding: 10px; }
    .field-row{ gap: 8px; }
    label{ font-size: 0.72rem; }
    input{ font-size: 0.9rem; padding: 7px 8px; }
    .hint{ font-size: 0.7rem; }
    button{ padding: 8px 10px; font-size: 0.85rem; width: 100%; }
    .btn-row{ flex-direction: column; }
    .tabs{ gap: 4px; }
    .tab-btn{ padding: 7px 9px; font-size: 0.74rem; }
    th, td{ padding: 5px 6px; font-size: 0.72rem; }
    .explain{ padding: 10px 10px; font-size: 0.82rem; }
    .formula{ font-size: 0.95rem; }
    .recomendacion{ padding: 10px 10px; font-size: 0.8rem; }
    .recomendacion table{ font-size: 0.74rem; }
    .recomendacion th, .recomendacion td{ padding: 4px 5px; }
    .final-answer{ padding: 10px 12px; font-size: 0.92rem; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="field-row">
      <div class="field" id="fieldFx" style="flex: 2 1 260px;">
        <label for="fx">f(x)</label>
        <input id="fx" type="text" value="" placeholder="ej: 2*x^3 - x^2 - 3" autocomplete="off">
        <span class="hint">Usa * y ^ para potencias.</span>
      </div>
      <div class="field" style="flex: 1 1 90px;">
        <label for="a"><span id="labelA">a</span></label>
        <input id="a" type="text" value="" placeholder="ej: -1" autocomplete="off">
      </div>
      <div class="field" id="fieldB" style="flex: 1 1 90px;">
        <label for="b"><span id="labelB">b</span></label>
        <input id="b" type="text" value="" placeholder="ej: 2" autocomplete="off">
      </div>
      <div class="field" style="flex: 1 1 130px;">
        <label for="tol">Tolerancia</label>
        <input id="tol" type="text" value="1e-7" placeholder="ej: 1e-7" autocomplete="off">
      </div>
    </div>
    <div id="fxDisplay" class="fx-display"></div>
    <div id="derivDisplay" class="fx-display" style="display:none; margin-top:8px;"></div>

    <div class="btn-row">
      <button onclick="actualizarTodo()">Generar tabla</button>
    </div>
  </div>

  <div id="statusBox"></div>

  <div class="tabs" id="tabsRow">
    <button class="tab-btn activo" id="tabBisec" onclick="cambiarMetodo('bisec')">Bisección<span class="tab-iter" id="iterBisec"></span><span class="badge-rec" id="badgeBisec"><span class="badge-star">★</span></span></button>
    <button class="tab-btn" id="tabFalsa" onclick="cambiarMetodo('falsa')">Regla Falsa<span class="tab-iter" id="iterFalsa"></span><span class="badge-rec" id="badgeFalsa"><span class="badge-star">★</span></span></button>
    <button class="tab-btn" id="tabSecante" onclick="cambiarMetodo('secante')">Secante<span class="tab-iter" id="iterSecante"></span><span class="badge-rec" id="badgeSecante"><span class="badge-star">★</span></span></button>
    <button class="tab-btn" id="tabNewton" onclick="cambiarMetodo('newton')">Newton-Raphson<span class="tab-iter" id="iterNewton"></span><span class="badge-rec" id="badgeNewton"><span class="badge-star">★</span></span></button>
    <button class="tab-btn" id="tabPF" onclick="cambiarMetodo('puntofijo')">Punto Fijo<span class="tab-iter" id="iterPF"></span><span class="badge-rec" id="badgePF"><span class="badge-star">★</span></span></button>
  </div>

  <div class="card" id="tableCard" style="display:none; border-top-left-radius:0;">
    <div class="table-scroll">
      <table class="tabla-resultado" id="resultTable">
        <thead>
          <tr>
            <th>It</th><th id="thA" class="col-a">a</th><th id="thB" class="col-b">b</th><th id="thFa" class="col-fa">f(a)</th><th id="thFb" class="col-fb">f(b)</th><th id="thXi" class="col-xi">xᵢ</th><th id="thFxi" class="col-fxi">f(xᵢ)</th><th class="col-error">Error</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="explain" id="explainBox"></div>

    <div id="finalAnswerBox"></div>
  </div>

</div>

<script>
  let rows = [];
  let funcionActual = null;
  let funcionDerivada = null;
  let funcionG = null;
  let adjacency = {};
  let metodoActual = 'bisec'; // 'bisec', 'falsa', 'secante', 'newton' o 'puntofijo'
  let modoManual = false; // true en cuanto el usuario toca una pestaña a mano; se resetea al cambiar f(x)

  const FIELD_ORDER = ['a','b','fa','fb','xi','fxi','error'];

  function hueForCell(campo, idx){
    const fieldIndex = FIELD_ORDER.indexOf(campo);
    const globalIndex = idx * FIELD_ORDER.length + fieldIndex;
    return (globalIndex * 137.508) % 360;
  }
  function colorForCell(campo, idx){ return 'hsl(' + hueForCell(campo, idx).toFixed(1) + ', 68%, 38%)'; }
  function bgForCell(campo, idx, alpha){ return 'hsla(' + hueForCell(campo, idx).toFixed(1) + ', 68%, 38%, ' + alpha + ')'; }
  function nodeKey(campo, idx){ return campo + '_' + idx; }
  function addDep(nodo, dependeDe){
    if (!adjacency[nodo]) adjacency[nodo] = new Set();
    adjacency[nodo].add(dependeDe);
  }

  function construirAdjacencia(){
    adjacency = {};
    rows.forEach((r, idx) => {
      if (r.divergio) return; // fila sin xi/fxi/error, no hay nada que enlazar

      const kA = nodeKey('a', idx), kB = nodeKey('b', idx);
      const kFa = nodeKey('fa', idx), kFb = nodeKey('fb', idx);
      const kXi = nodeKey('xi', idx), kFxi = nodeKey('fxi', idx);
      const kErr = nodeKey('error', idx);

      addDep(kXi, kA);
      addDep(kXi, kB);
      if (metodoActual === 'falsa' || metodoActual === 'secante'){
        addDep(kXi, kFa);
        addDep(kXi, kFb);
      }
      addDep(kFa, kA);
      addDep(kFb, kB);
      addDep(kFxi, kXi);

      if (metodoActual === 'newton'){
        addDep(kXi, kFa);
        addDep(kErr, kXi);
        addDep(kErr, kA);
        if (idx > 0) addDep(kA, nodeKey('xi', idx - 1));
        return;
      }

      if (metodoActual === 'puntofijo'){
        addDep(kXi, kFa);
        addDep(kErr, kXi);
        addDep(kErr, kA);
        if (idx > 0) addDep(kA, nodeKey('xi', idx - 1));
        return;
      }

      if (metodoActual === 'secante'){
        // el error usa el x1 de la MISMA fila, no el xi de la fila anterior
        addDep(kErr, kXi);
        addDep(kErr, kB);
        if (r.cambioParaLlegarAqui === 'desliza'){
          addDep(kA, nodeKey('b', idx - 1));
          addDep(kB, nodeKey('xi', idx - 1));
        }
        return;
      }

      if (idx > 0){
        addDep(kErr, kXi);
        addDep(kErr, nodeKey('xi', idx - 1));
      }

      if (r.cambioParaLlegarAqui === 'a'){
        addDep(kA, nodeKey('xi', idx - 1));
        addDep(kA, nodeKey('fa', idx - 1));
        addDep(kA, nodeKey('fxi', idx - 1));
        addDep(kB, nodeKey('b', idx - 1));
      } else if (r.cambioParaLlegarAqui === 'b'){
        addDep(kB, nodeKey('xi', idx - 1));
        addDep(kB, nodeKey('fa', idx - 1));
        addDep(kB, nodeKey('fxi', idx - 1));
        addDep(kA, nodeKey('a', idx - 1));
      }
    });
  }

  Decimal.set({ precision: 40 });

  function prepararExpresion(expr){
    let e = expr.trim();
    let anterior;
    do {
      anterior = e;
      e = e.replace(/(\d)(x)/gi, '$1*$2');
      e = e.replace(/(x)(\d)/gi, '$1*$2');
      e = e.replace(/(x)(x)/gi, '$1*$2');
      e = e.replace(/(\))(\d|x|\()/gi, '$1*$2');
      e = e.replace(/(\d)(\()/g, '$1*$2');
      e = e.replace(/(x)(\()/gi, '$1*$2');
    } while (e !== anterior);
    return e;
  }

  function tokenizar(expr){
    const tokens = [];
    let i = 0;
    while (i < expr.length){
      const c = expr[i];
      if (/\s/.test(c)){ i++; continue; }
      if (/[0-9.]/.test(c)){
        let j = i;
        while (j < expr.length && /[0-9.]/.test(expr[j])) j++;
        tokens.push({ type: 'NUM', value: expr.slice(i, j) });
        i = j;
        continue;
      }
      if (c.toLowerCase() === 'x'){ tokens.push({ type: 'VAR' }); i++; continue; }
      if ('+-*/^()'.includes(c)){ tokens.push({ type: c }); i++; continue; }
      throw new Error('Carácter no reconocido: ' + c);
    }
    return tokens;
  }

  function construirAst(tokens){
    let pos = 0;
    const peek = () => tokens[pos];
    const consume = (type) => {
      const t = tokens[pos];
      if (!t || t.type !== type) throw new Error('Se esperaba ' + type);
      pos++;
      return t;
    };
    function parseExpresion(){
      let node = parseTermino();
      while (peek() && (peek().type === '+' || peek().type === '-')){
        const op = consume(peek().type).type;
        node = { type: 'bin', op, left: node, right: parseTermino() };
      }
      return node;
    }
    function parseTermino(){
      let node = parseUnario();
      while (peek() && (peek().type === '*' || peek().type === '/')){
        const op = consume(peek().type).type;
        node = { type: 'bin', op, left: node, right: parseUnario() };
      }
      return node;
    }
    function parseUnario(){
      if (peek() && peek().type === '-'){ consume('-'); return { type: 'neg', arg: parseUnario() }; }
      if (peek() && peek().type === '+'){ consume('+'); return parseUnario(); }
      return parsePotencia();
    }
    function parsePotencia(){
      let node = parsePrimario();
      if (peek() && peek().type === '^'){
        consume('^');
        node = { type: 'bin', op: '^', left: node, right: parseUnario() };
      }
      return node;
    }
    function parsePrimario(){
      const t = peek();
      if (!t) throw new Error('Expresión incompleta');
      if (t.type === 'NUM'){ consume('NUM'); return { type: 'num', value: t.value }; }
      if (t.type === 'VAR'){ consume('VAR'); return { type: 'var' }; }
      if (t.type === '('){ consume('('); const n = parseExpresion(); consume(')'); return n; }
      if (t.type === '-'){ consume('-'); return { type: 'neg', arg: parsePrimario() }; }
      throw new Error('Token inesperado: ' + t.type);
    }
    const ast = parseExpresion();
    if (pos !== tokens.length) throw new Error('Expresión mal formada');
    return ast;
  }

  function evaluarAst(node, xDec){
    switch (node.type){
      case 'num': return new Decimal(node.value);
      case 'var': return xDec;
      case 'neg': return evaluarAst(node.arg, xDec).negated();
      case 'bin': {
        const l = evaluarAst(node.left, xDec);
        const r = evaluarAst(node.right, xDec);
        switch (node.op){
          case '+': return l.plus(r);
          case '-': return l.minus(r);
          case '*': return l.times(r);
          case '/': return l.dividedBy(r);
          case '^': return l.pow(r);
        }
      }
    }
    throw new Error('Nodo no soportado');
  }

  function construirEvaluador(expr){
    const tokens = tokenizar(prepararExpresion(expr));
    const ast = construirAst(tokens);
    const fn = function(xValue){
      const xDec = (xValue instanceof Decimal) ? xValue : new Decimal(xValue);
      return evaluarAst(ast, xDec);
    };
    fn.tokens = tokens;
    fn.ast = ast;
    return fn;
  }

  // --- Diferenciación simbólica (para Newton-Raphson) -----------------

  function nodoNum(n){ return { type: 'num', value: fmtNumSimple(n) }; }
  function fmtNumSimple(n){
    if (Object.is(n, -0)) n = 0;
    if (Number.isInteger(n)) return String(n);
    let s = n.toFixed(10);
    s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }
  function esNum(node, n){ return node.type === 'num' && parseFloat(node.value) === n; }

  function simplificar(node){
    if (node.type === 'num' || node.type === 'var') return node;
    if (node.type === 'neg'){
      const arg = simplificar(node.arg);
      if (arg.type === 'num') return nodoNum(-parseFloat(arg.value));
      if (arg.type === 'neg') return arg.arg;
      if (arg.type === 'bin' && (arg.op === '+' || arg.op === '-')){
        const nuevoOp = (arg.op === '+') ? '-' : '+';
        return simplificar({ type: 'bin', op: nuevoOp, left: { type: 'neg', arg: arg.left }, right: arg.right });
      }
      return { type: 'neg', arg };
    }
    if (node.type === 'bin'){
      const l = simplificar(node.left);
      const r = simplificar(node.right);
      const op = node.op;
      if (l.type === 'num' && r.type === 'num'){
        const a = parseFloat(l.value), b = parseFloat(r.value);
        let v;
        if (op === '+') v = a + b;
        else if (op === '-') v = a - b;
        else if (op === '*') v = a * b;
        else if (op === '/') v = a / b;
        else if (op === '^') v = Math.pow(a, b);
        return nodoNum(v);
      }
      if (op === '+'){
        if (esNum(l, 0)) return r;
        if (esNum(r, 0)) return l;
      }
      if (op === '-'){
        if (esNum(r, 0)) return l;
        if (esNum(l, 0)) return simplificar({ type: 'neg', arg: r });
      }
      if (op === '*'){
        if (esNum(l, 0) || esNum(r, 0)) return nodoNum(0);
        if (esNum(l, 1)) return r;
        if (esNum(r, 1)) return l;
        if (l.type === 'num' && r.type === 'bin' && r.op === '*' && r.left.type === 'num'){
          return simplificar({ type: 'bin', op: '*', left: nodoNum(parseFloat(l.value) * parseFloat(r.left.value)), right: r.right });
        }
        if (l.type === 'num' && r.type === 'bin' && r.op === '*' && r.right.type === 'num'){
          return simplificar({ type: 'bin', op: '*', left: nodoNum(parseFloat(l.value) * parseFloat(r.right.value)), right: r.left });
        }
        if (r.type === 'num' && l.type === 'bin' && l.op === '*' && l.left.type === 'num'){
          return simplificar({ type: 'bin', op: '*', left: nodoNum(parseFloat(r.value) * parseFloat(l.left.value)), right: l.right });
        }
        if (r.type === 'num' && l.type === 'bin' && l.op === '*' && l.right.type === 'num'){
          return simplificar({ type: 'bin', op: '*', left: nodoNum(parseFloat(r.value) * parseFloat(l.right.value)), right: l.left });
        }
      }
      if (op === '/'){
        if (esNum(l, 0)) return nodoNum(0);
        if (esNum(r, 1)) return l;
      }
      if (op === '^'){
        if (esNum(r, 0)) return nodoNum(1);
        if (esNum(r, 1)) return l;
      }
      return { type: 'bin', op, left: l, right: r };
    }
    return node;
  }

  function derivarAst(node){
    switch (node.type){
      case 'num': return nodoNum(0);
      case 'var': return nodoNum(1);
      case 'neg': return simplificar({ type: 'neg', arg: derivarAst(node.arg) });
      case 'bin': {
        const { op, left, right } = node;
        if (op === '+' || op === '-'){
          return simplificar({ type: 'bin', op, left: derivarAst(left), right: derivarAst(right) });
        }
        if (op === '*'){
          const t1 = simplificar({ type: 'bin', op: '*', left: derivarAst(left), right });
          const t2 = simplificar({ type: 'bin', op: '*', left, right: derivarAst(right) });
          return simplificar({ type: 'bin', op: '+', left: t1, right: t2 });
        }
        if (op === '/'){
          const t1 = simplificar({ type: 'bin', op: '*', left: derivarAst(left), right });
          const t2 = simplificar({ type: 'bin', op: '*', left, right: derivarAst(right) });
          const numerador = simplificar({ type: 'bin', op: '-', left: t1, right: t2 });
          const denominador = simplificar({ type: 'bin', op: '^', left: right, right: nodoNum(2) });
          return simplificar({ type: 'bin', op: '/', left: numerador, right: denominador });
        }
        if (op === '^'){
          if (right.type !== 'num'){
            throw new Error('EXPONENTE_NO_CONSTANTE');
          }
          const n = parseFloat(right.value);
          const potenciaMenor = simplificar({ type: 'bin', op: '^', left, right: nodoNum(n - 1) });
          const conRegla = simplificar({ type: 'bin', op: '*', left: potenciaMenor, right: derivarAst(left) });
          return simplificar({ type: 'bin', op: '*', left: nodoNum(n), right: conRegla });
        }
      }
    }
    throw new Error('No se pudo derivar esta expresión.');
  }

  function derivarFuncion(f){
    const astDeriv = simplificar(derivarAst(f.ast));
    const fn = function(xValue){
      const xDec = (xValue instanceof Decimal) ? xValue : new Decimal(xValue);
      return evaluarAst(astDeriv, xDec);
    };
    fn.ast = astDeriv;
    return fn;
  }

  // --- Punto Fijo automático: aísla el término de mayor grado de f(x)=0 -----
  // Técnica estándar: a_n·xⁿ + resto = 0  →  xⁿ = -resto/a_n  →  x = (-resto/a_n)^(1/n)

  function aplanarSuma(node, signo, terminos){
    if (node.type === 'bin' && (node.op === '+' || node.op === '-')){
      aplanarSuma(node.left, signo, terminos);
      aplanarSuma(node.right, node.op === '-' ? -signo : signo, terminos);
    } else if (node.type === 'neg'){
      aplanarSuma(node.arg, -signo, terminos);
    } else {
      terminos.push({ signo, nodo: node });
    }
  }

  function monomioBase(n){
    if (n.type === 'num') return { coef: parseFloat(n.value), grado: 0 };
    if (n.type === 'var') return { coef: 1, grado: 1 };
    if (n.type === 'bin' && n.op === '^' && n.left.type === 'var' && n.right.type === 'num'){
      return { coef: 1, grado: parseFloat(n.right.value) };
    }
    if (n.type === 'bin' && n.op === '*'){
      const l = monomioBase(n.left);
      const r = monomioBase(n.right);
      return (l && r) ? { coef: l.coef * r.coef, grado: l.grado + r.grado } : null;
    }
    if (n.type === 'neg'){
      const r = monomioBase(n.arg);
      return r ? { coef: -r.coef, grado: r.grado } : null;
    }
    return null;
  }

  function construirMonomioAst(coefAbs, grado){
    if (grado === 0) return nodoNum(coefAbs);
    const potencia = (grado === 1) ? { type: 'var' } : { type: 'bin', op: '^', left: { type: 'var' }, right: nodoNum(grado) };
    if (coefAbs === 1) return potencia;
    return { type: 'bin', op: '*', left: nodoNum(coefAbs), right: potencia };
  }

  function derivarPuntoFijoCandidatos(astF){
    const crudos = [];
    aplanarSuma(astF, 1, crudos);
    const terminos = [];
    for (const t of crudos){
      const m = monomioBase(t.nodo);
      if (!m) throw new Error('NO_ES_POLINOMIO_SIMPLE');
      terminos.push({ coef: t.signo * m.coef, grado: m.grado });
    }
    const candidatos = [];
    terminos.forEach((lider, idxLider) => {
      if (lider.grado < 1) return; // el término aislado debe contener x
      let restoAst = nodoNum(0);
      terminos.forEach((t, i) => {
        if (i === idxLider) return;
        const term = construirMonomioAst(Math.abs(t.coef), t.grado);
        const termConSigno = t.coef < 0 ? { type: 'neg', arg: term } : term;
        restoAst = simplificar({ type: 'bin', op: '+', left: restoAst, right: termConSigno });
      });
      const menosResto = simplificar({ type: 'neg', arg: restoAst });
      const dividido = simplificar({ type: 'bin', op: '/', left: menosResto, right: nodoNum(lider.coef) });
      const exponente = nodoNum(1 / lider.grado);
      const astG = simplificar({ type: 'bin', op: '^', left: dividido, right: exponente });
      candidatos.push({ astG, grado: lider.grado, coefLider: lider.coef, menosResto, dividido });
    });
    if (candidatos.length === 0) throw new Error('SIN_TERMINO_CON_X');
    // Se intenta primero aislando el término de MAYOR grado (lo más natural / lo que se enseña primero),
    // y si no converge se van probando los demás en orden descendente — igual que un cuaderno descarta las que divergen.
    candidatos.sort((a, b) => b.grado - a.grado);
    return candidatos;
  }

  function astComoFuncion(ast){
    const fn = function(xValue){
      const xDec = (xValue instanceof Decimal) ? xValue : new Decimal(xValue);
      return evaluarAst(ast, xDec);
    };
    fn.ast = ast;
    return fn;
  }

  // Prueba cada g(x) candidata desde x0 y se queda con la primera que converge de verdad.
  function elegirPuntoFijoConvergente(f, x0, tol, maxIt){
    const candidatos = derivarPuntoFijoCandidatos(f.ast);
    let mejorIntento = null;
    for (const c of candidatos){
      const g = astComoFuncion(c.astG);
      let filas;
      try{ filas = correrPuntoFijo(g, x0, tol, maxIt); }
      catch(e){ continue; }
      const last = filas[filas.length - 1];
      const convergio = !last.divergio && last.error !== null && last.error.lessThan(tol);
      const intento = { g, filas, convergio, grado: c.grado, coefLider: c.coefLider, menosResto: c.menosResto, dividido: c.dividido };
      if (!mejorIntento) mejorIntento = intento;
      if (convergio) return intento;
    }
    return mejorIntento; // ninguna convergió: se reporta el primer intento (el más natural) para explicar por qué
  }

  // Renderiza un AST (usado para la derivada, que no tiene tokens propios)
  function necesitaParen(node, contexto){
    if (node.type === 'neg') return contexto !== 'top';
    if (node.type !== 'bin') return false;
    const esAditivo = node.op === '+' || node.op === '-';
    const esMulDiv = node.op === '*' || node.op === '/';
    if (esAditivo) return contexto !== 'top';
    if (esMulDiv && (contexto === 'pow-base' || contexto === 'div-right')) return true;
    return false;
  }

  function astAHtmlCtx(node, contexto, renderVar){
    const html = astAHtml(node, renderVar);
    return necesitaParen(node, contexto) ? '(' + html + ')' : html;
  }

  function astAHtml(node, renderVar){
    renderVar = renderVar || (() => 'x');
    switch (node.type){
      case 'num': return fmt(new Decimal(node.value));
      case 'var': return renderVar();
      case 'neg': return '−' + astAHtmlCtx(node.arg, 'neg', renderVar);
      case 'bin': {
        const { op, left, right } = node;
        if (op === '^'){
          return astAHtmlCtx(left, 'pow-base', renderVar) + '<sup>' + astAHtml(right, renderVar) + '</sup>';
        }
        if (op === '*'){
          return astAHtmlCtx(left, 'mul', renderVar) + ' · ' + astAHtmlCtx(right, 'mul', renderVar);
        }
        if (op === '/'){
          return astAHtmlCtx(left, 'div-left', renderVar) + ' ÷ ' + astAHtmlCtx(right, 'div-right', renderVar);
        }
        let rightNode = right, opSimbolo = op;
        if (rightNode.type === 'num' && parseFloat(rightNode.value) < 0){
          rightNode = nodoNum(-parseFloat(rightNode.value));
          opSimbolo = (op === '+') ? '-' : '+';
        } else if (rightNode.type === 'neg'){
          rightNode = rightNode.arg;
          opSimbolo = (op === '+') ? '-' : '+';
        }
        const rightCtx = (opSimbolo === '-') ? 'sub-right' : 'top';
        const simbolo = (opSimbolo === '+') ? ' + ' : ' − ';
        return astAHtmlCtx(left, 'top', renderVar) + simbolo + astAHtmlCtx(rightNode, rightCtx, renderVar);
      }
    }
  }

  function formatearSustitucionAst(node, valorXStr){
    return astAHtml(node, () => '(' + valorXStr + ')');
  }

  const DISPLAY_OP = { '+': '+', '-': '−', '*': '·', '/': '÷', '^': '^' };

  function renderizarFormula(tokens, renderVar, renderNum){
    let out = '';
    let i = 0;
    while (i < tokens.length){
      const t = tokens[i];
      if (t.type === 'VAR'){ out += renderVar(); i++; continue; }
      if (t.type === 'NUM'){ out += renderNum(t.value, i); i++; continue; }
      if (t.type === '('){ out += '('; i++; continue; }
      if (t.type === ')'){ out += ')'; i++; continue; }
      if (t.type === '^'){
        i++;
        let exp = '';
        if (tokens[i] && tokens[i].type === '-'){ exp += '−'; i++; }
        if (tokens[i] && tokens[i].type === 'NUM'){ exp += renderNum(tokens[i].value, i); i++; }
        else if (tokens[i] && tokens[i].type === '('){
          let depth = 0;
          do {
            const tk = tokens[i];
            if (tk.type === '(') depth++;
            if (tk.type === ')') depth--;
            exp += (tk.type === 'NUM') ? renderNum(tk.value, i) : (tk.type === 'VAR' ? renderVar() : tk.type);
            i++;
          } while (depth > 0 && i < tokens.length);
        }
        out += exp ? ('<sup>' + exp + '</sup>') : '^';
        continue;
      }
      const prev = tokens[i - 1];
      const esUnario = (t.type === '-' || t.type === '+') &&
                        (!prev || ['+','-','*','/','^','('].includes(prev.type));
      out += esUnario ? DISPLAY_OP[t.type] : (' ' + DISPLAY_OP[t.type] + ' ');
      i++;
    }
    return out.replace(/\s+/g, ' ').trim();
  }

  function formatearSustitucion(tokens, valorXStr, inputId){
    inputId = inputId || 'fx';
    return renderizarFormula(tokens, () => '(' + valorXStr + ')', (valor, tokIdx) => refInput(inputId, valor, tokIdx));
  }

  function renderFormulaEnPanel(tokens, prefijo, elId){
    const cuerpo = renderizarFormula(tokens, () => 'x', (valor, tokIdx) => '<span class="fx-token" id="fx-tok-' + tokIdx + '">' + valor + '</span>');
    const el = document.getElementById(elId);
    if (el) el.innerHTML = prefijo + cuerpo;
  }

  function renderFormulaCompleta(tokens){
    renderFormulaEnPanel(tokens, 'f(x) = ', 'fxDisplay');
  }

  function fmt(d){
    if (d === null || d === undefined) return '—';
    let s = d.toFixed(10);
    if (s.includes('.')){ s = s.replace(/0+$/, ''); s = s.replace(/\.$/, ''); }
    if (s === '-0' || s === '') s = '0';
    return s;
  }

  function anotarRepeticiones(numStr){
    let out = '';
    let i = 0;
    while (i < numStr.length){
      const c = numStr[i];
      if (/[0-9]/.test(c)){
        let j = i;
        while (j < numStr.length && numStr[j] === c) j++;
        const largo = j - i;
        const digitos = c.repeat(largo);
        if (largo >= 2){
          out += '<span class="run-brace-char">' + digitos + '<span class="run-count">' + largo + '</span></span>';
        } else {
          out += digitos;
        }
        i = j;
      } else {
        out += c;
        i++;
      }
    }
    return out;
  }

  function fmtAnotado(d){
    return anotarRepeticiones(fmt(d));
  }

  function setStatus(msg, type){
    if (!msg || !type){
      document.getElementById('statusBox').innerHTML = '';
      return;
    }
    document.getElementById('statusBox').innerHTML = '<div class="status ' + type + '">' + msg + '</div>';
  }

  function calcularXi(metodo, a, b, fa, fb){
    if (metodo === 'falsa' || metodo === 'secante'){
      return a.plus( (a.minus(b)).times(fa).dividedBy( fb.minus(fa) ) );
    }
    return a.plus(b).dividedBy(2);
  }

  function correrSecante(f, x0Init, x1Init, tol, maxIt){
    let a = x0Init, b = x1Init; // a = x0 (aproximación anterior), b = x1 (aproximación actual)
    const filas = [];
    for (let it = 1; it <= maxIt; it++){
      const fa = f(a), fb = f(b);
      const denom = fb.minus(fa);
      if (denom.isZero() || !denom.isFinite()){
        filas.push({ it, a, b, fa, fb, xi: null, fxi: null, error: null, cambioParaLlegarAqui: (it === 1 ? null : 'desliza'), producto: null, divergio: true });
        break;
      }
      const xi = calcularXi('secante', a, b, fa, fb);
      if (!xi.isFinite()){
        filas.push({ it, a, b, fa, fb, xi: null, fxi: null, error: null, cambioParaLlegarAqui: (it === 1 ? null : 'desliza'), producto: null, divergio: true });
        break;
      }
      const fxi = f(xi);
      const error = xi.minus(b).abs();
      const producto = fa.times(fxi);
      filas.push({ it, a, b, fa, fb, xi, fxi, error, cambioParaLlegarAqui: (it === 1 ? null : 'desliza'), producto });
      if (error.lessThan(tol)) break;
      a = b;
      b = xi;
    }
    return filas;
  }

  function correrMetodo(metodo, f, aInit, bInit, tol, maxIt){
    if (metodo === 'secante') return correrSecante(f, aInit, bInit, tol, maxIt);

    let a = aInit, b = bInit;
    let xiPrev = null;
    let cambioAnterior = null;
    const filas = [];
    for (let it = 1; it <= maxIt; it++){
      const fa = f(a), fb = f(b);
      const xi = calcularXi(metodo, a, b, fa, fb);
      const fxi = f(xi);
      const error = (xiPrev === null) ? null : xi.minus(xiPrev).abs();
      const producto = fa.times(fxi);
      const siguienteCambia = producto.lessThan(0) ? 'b' : 'a';
      filas.push({ it, a, b, fa, fb, xi, fxi, error, cambioParaLlegarAqui: cambioAnterior, siguienteCambia, producto });
      if (error !== null && error.lessThan(tol)) break;
      if (siguienteCambia === 'b'){ b = xi; cambioAnterior = 'b'; } else { a = xi; cambioAnterior = 'a'; }
      xiPrev = xi;
    }
    return filas;
  }

  function correrNewton(f, fPrime, x0, tol, maxIt){
    let xActual = x0;
    const filas = [];
    for (let it = 1; it <= maxIt; it++){
      const fa = f(xActual);
      const fpa = fPrime(xActual);
      if (fpa.isZero() || !fpa.isFinite()){
        filas.push({ it, a: xActual, b: fpa, fa, fb: null, xi: null, fxi: null, error: null, divergio: true });
        break;
      }
      const xSig = xActual.minus(fa.dividedBy(fpa));
      if (!xSig.isFinite()){
        filas.push({ it, a: xActual, b: fpa, fa, fb: null, xi: null, fxi: null, error: null, divergio: true });
        break;
      }
      const error = xSig.minus(xActual).abs();
      filas.push({ it, a: xActual, b: fpa, fa, fb: null, xi: xSig, fxi: f(xSig), error, divergio: false });
      if (error.lessThan(tol)) break;
      xActual = xSig;
    }
    return filas;
  }

  function correrPuntoFijo(g, x0, tol, maxIt){
    let xActual = x0;
    const filas = [];
    for (let it = 1; it <= maxIt; it++){
      const ga = g(xActual);
      if (!ga.isFinite()){
        filas.push({ it, a: xActual, b: null, fa: ga, fb: null, xi: null, fxi: null, error: null, divergio: true });
        break;
      }
      const error = ga.minus(xActual).abs();
      filas.push({ it, a: xActual, b: null, fa: ga, fb: null, xi: ga, fxi: null, error, divergio: false });
      if (error.lessThan(tol)) break;
      xActual = ga;
    }
    return filas;
  }

  function faltanCampos(...vals){
    return vals.some(v => v === undefined || v === null || String(v).trim() === '');
  }

  function mensajeFaltantes(items){
    const faltan = items.filter(([, v]) => !v || !String(v).trim()).map(([label]) => label);
    if (faltan.length === 0) return 'Revisa los valores.';
    if (faltan.length === 1) return 'Escribe ' + faltan[0] + ' para comenzar.';
    return 'Escribe ' + faltan.slice(0, -1).join(', ') + ' y ' + faltan[faltan.length - 1] + ' para comenzar.';
  }

  function generarTablaNewton(){
    const fxRaw = document.getElementById('fx').value;
    const aStr = document.getElementById('a').value;
    const tolStr = document.getElementById('tol').value;

    if (faltanCampos(fxRaw, aStr, tolStr)){
      setStatus('', null);
      return;
    }

    let f, fPrime, aInit, tol;
    try{
      f = construirEvaluador(fxRaw);
      funcionActual = f;
      renderFormulaEnPanel(f.tokens, 'f(x) = ', 'fxDisplay');
      aInit = new Decimal(aStr);
      tol = new Decimal(tolStr);
      if (!f(aInit).isFinite()) throw new Error('No finito');
    }catch(err){
      setStatus('Revisa f(x), x₀ y la tolerancia.', 'error');
      return;
    }

    try{
      fPrime = derivarFuncion(f);
      funcionDerivada = fPrime;
      const terminos = [];
      aplanarSuma(f.ast, 1, terminos);
      const desglose = terminos.map(t => {
        const nodoSigno = (t.signo < 0) ? { type: 'neg', arg: t.nodo } : t.nodo;
        const derivadaTermino = simplificar(derivarAst(nodoSigno));
        return astAHtml(nodoSigno) + ' → ' + astAHtml(derivadaTermino);
      }).join('  ·  ');
      const el = document.getElementById('derivDisplay');
      el.className = 'fx-display';
      el.style.cssText = 'display:block; margin-top:8px;';
      el.innerHTML =
        '<div class="formula" style="font-size:0.85em;">d/dx: ' + desglose + '</div>' +
        '<div class="formula">f\'(x) = ' + astAHtml(fPrime.ast) + '</div>' +
        '<span class="hint" style="display:block;margin-top:4px;">Evaluando x₀ = ' + fmt(aInit) + '</span>';
    }catch(err){
      setStatus('No pude derivar esta función. Prueba otro método.', 'error');
      return;
    }

    rows = correrNewton(f, fPrime, aInit, tol, 80);
    pintarTabla(tol);
    construirAdjacencia();
  }

  function generarTablaPuntoFijo(){
    const fxRaw = document.getElementById('fx').value;
    const aStr = document.getElementById('a').value;
    const tolStr = document.getElementById('tol').value;

    if (faltanCampos(fxRaw, aStr, tolStr)){
      setStatus('', null);
      return;
    }

    let f, aInit, tol;
    try{
      f = construirEvaluador(fxRaw);
      funcionActual = f;
      aInit = new Decimal(aStr);
      tol = new Decimal(tolStr);
      if (!f(aInit).isFinite()) throw new Error('No finito');
    }catch(err){
      setStatus('Revisa f(x), x₀ y la tolerancia.', 'error');
      return;
    }

    let resultado;
    try{
      resultado = elegirPuntoFijoConvergente(f, aInit, tol, 80);
    }catch(err){
      setStatus('No pude despejar x de esta f(x). Prueba otro método.', 'error');
      return;
    }

    funcionG = resultado.g;
    renderFormulaEnPanel(f.tokens, 'f(x) = ', 'fxDisplay');

    const grado = resultado.grado;
    const coefTxt = (resultado.coefLider === 1) ? '' : fmtNumSimple(resultado.coefLider) + '·';
    const xGrado = 'x' + (grado === 1 ? '' : '<sup>' + grado + '</sup>');
    const menosRestoHtml = astAHtml(resultado.menosResto);
    const dividendoHtml = menosRestoHtml;
    const divisorHtml = fmtNumSimple(resultado.coefLider);

    const el = document.getElementById('derivDisplay');
    el.className = 'fx-display';
    el.style.cssText = 'display:block; margin-top:8px;';
    const paso2 = (resultado.coefLider === 1) ? menosRestoHtml : fraccion(dividendoHtml, divisorHtml);
    el.innerHTML =
      '<div class="formula">' + coefTxt + xGrado + ' = ' + menosRestoHtml + '</div>' +
      '<div class="formula">' + xGrado + ' = ' + paso2 + '</div>' +
      '<div class="formula">x = ' + raiz(grado, paso2) + ' = g(x)</div>' +
      '<span class="hint" style="display:block;margin-top:6px;">Evaluando x₀ = ' + fmt(aInit) +
      (resultado.convergio ? '' : ' — no convergió') + '</span>';

    rows = resultado.filas;
    pintarTabla(tol);
    construirAdjacencia();
  }

  function cambiarMetodo(metodo, esAutomatico){
    metodoActual = metodo;
    if (!esAutomatico) modoManual = true;
    document.getElementById('tabBisec').classList.toggle('activo', metodo === 'bisec');
    document.getElementById('tabFalsa').classList.toggle('activo', metodo === 'falsa');
    document.getElementById('tabSecante').classList.toggle('activo', metodo === 'secante');
    document.getElementById('tabNewton').classList.toggle('activo', metodo === 'newton');
    document.getElementById('tabPF').classList.toggle('activo', metodo === 'puntofijo');

    const esSecante = metodo === 'secante';
    const esNewton = metodo === 'newton';
    const esPF = metodo === 'puntofijo';

    // El campo f(x) es el mismo para los 5 métodos (Punto Fijo deriva g(x) sola).
    // El campo b no se oculta: si no se usa, se deja visible pero deshabilitado y atenuado,
    // para que quede claro que el valor sigue ahí (no se perdió al cambiar de método).
    const noUsaB = esNewton || esPF;
    document.getElementById('fieldB').style.opacity = noUsaB ? '0.55' : '1';
    document.getElementById('derivDisplay').style.display = 'none';

    document.getElementById('labelA').textContent = (esSecante || esNewton || esPF) ? 'x₀' : 'a';
    document.getElementById('labelB').textContent = esSecante ? 'x₁' : 'b';

    if (esNewton){
      document.getElementById('thA').textContent = 'xᵢ';
      document.getElementById('thB').textContent = "f'(xᵢ)";
      document.getElementById('thFa').textContent = 'f(xᵢ)';
      document.getElementById('thXi').textContent = 'xᵢ₊₁';
      document.getElementById('thFxi').textContent = 'f(xᵢ₊₁)';
    } else if (esPF){
      document.getElementById('thA').textContent = 'xᵢ';
      document.getElementById('thFa').textContent = 'g(xᵢ)';
      document.getElementById('thXi').textContent = 'xᵢ₊₁';
    } else {
      document.getElementById('thA').textContent = esSecante ? 'x₀' : 'a';
      document.getElementById('thB').textContent = esSecante ? 'x₁' : 'b';
      document.getElementById('thFa').textContent = esSecante ? 'f(x₀)' : 'f(a)';
      document.getElementById('thFb').textContent = esSecante ? 'f(x₁)' : 'f(b)';
      document.getElementById('thXi').textContent = 'xᵢ';
      document.getElementById('thFxi').textContent = 'f(xᵢ)';
    }

    const tabla = document.getElementById('resultTable');
    tabla.classList.remove('oculta-b', 'oculta-fb', 'oculta-fxi', 'oculta-xi');
    if (esNewton) tabla.classList.add('oculta-fb');
    if (esPF) tabla.classList.add('oculta-b', 'oculta-fb', 'oculta-fxi', 'oculta-xi');

    actualizarVistaPrevia();
    generarTabla();
  }

  function generarTabla(){
    document.getElementById('statusBox').innerHTML = '';
    document.getElementById('tableCard').style.display = 'none';
    document.getElementById('finalAnswerBox').innerHTML = '';

    if (metodoActual === 'puntofijo'){ generarTablaPuntoFijo(); return; }
    if (metodoActual === 'newton'){ generarTablaNewton(); return; }

    const fxRaw = document.getElementById('fx').value;
    const aStr = document.getElementById('a').value;
    const bStr = document.getElementById('b').value;
    const tolStr = document.getElementById('tol').value;

    if (faltanCampos(fxRaw, aStr, bStr, tolStr)){
      setStatus('', null);
      return;
    }

    let f, aInit, bInit, tol;
    try{
      f = construirEvaluador(fxRaw);
      funcionActual = f;
      renderFormulaCompleta(f.tokens);
      aInit = new Decimal(aStr);
      bInit = new Decimal(bStr);
      tol = new Decimal(tolStr);
      const testVal = f(aInit);
      if (!testVal.isFinite()) throw new Error('No finito');
    }catch(err){
      setStatus('Revisa f(x), a, b y la tolerancia.', 'error');
      return;
    }

    const fa0 = f(aInit);
    const fb0 = f(bInit);

    if (metodoActual === 'secante'){
      if (aInit.equals(bInit)){
        setStatus('x₀ y x₁ deben ser distintos.', 'error');
        return;
      }
    } else if (fa0.times(fb0).greaterThanOrEqualTo(0)){
      setStatus('f(a)·f(b) = ' + fmt(fa0.times(fb0)) + ', no es negativo. No hay raíz garantizada en [a,b].', 'error');
      return;
    }

    rows = correrMetodo(metodoActual, f, aInit, bInit, tol, 80);
    pintarTabla(tol);
    construirAdjacencia();
  }

  function pintarTabla(tol){
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    document.getElementById('finalAnswerBox').innerHTML = '';

    rows.forEach((r, idx) => {
      const tr = document.createElement('tr');
      const esFinal = idx === rows.length - 1 && r.error !== null && r.error.lessThan(tol);
      if (esFinal) tr.classList.add('final-row');
      tr.innerHTML =
        '<td class="it-col">' + r.it + '</td>' +
        celda('a', idx) + celda('b', idx) +
        celda('fa', idx) + celda('fb', idx) +
        celda('xi', idx) + celda('fxi', idx) +
        celda('error', idx);
      if (esFinal){
        const colResultado = (metodoActual === 'puntofijo') ? 'td.col-fa' : 'td.col-xi';
        const celdaResultado = tr.querySelector(colResultado);
        if (celdaResultado) celdaResultado.classList.add('celda-raiz');
      }
      tbody.appendChild(tr);
    });

    document.querySelectorAll('#resultTable td.clickable').forEach(td => {
      td.addEventListener('click', () => seleccionarCelda(td.dataset.campo, parseInt(td.dataset.idx)));
    });

    document.getElementById('tableCard').style.display = 'block';
    document.getElementById('explainBox').innerHTML = '';

    const last = rows[rows.length - 1];
    if (last.divergio){
      let msg;
      if (metodoActual === 'secante'){
        msg = 'Diverge: f(x₀) = f(x₁). Prueba otros puntos.';
      } else if (metodoActual === 'newton'){
        msg = "Diverge: f'(xᵢ) = 0. Prueba otro x₀.";
      } else if (metodoActual === 'puntofijo'){
        msg = 'Ninguna g(x) convergió. Prueba otro x₀ o método.';
      } else {
        msg = 'El método no puede continuar.';
      }
      setStatus(msg, 'error');
    } else if (last.error !== null && last.error.lessThan(tol)){
      setStatus('', null);
      document.getElementById('finalAnswerBox').innerHTML =
        '<div class="final-answer">r ≈ <strong>' + fmtAnotado(last.xi) + '</strong></div>';
    } else {
      setStatus('No se alcanzó la tolerancia.', 'error');
    }
  }

  const NOMBRE_METODO = { bisec: 'Bisección', falsa: 'Regla Falsa', secante: 'Secante', newton: 'Newton-Raphson', puntofijo: 'Punto Fijo' };

  function calcularRecomendacion(){
    const fxRaw = document.getElementById('fx').value;
    const aStr = document.getElementById('a').value;
    const bStr = document.getElementById('b').value;
    const tolStr = document.getElementById('tol').value;

    let f, aInit, bInit, tol;
    try{
      f = construirEvaluador(fxRaw);
      aInit = new Decimal(aStr);
      bInit = new Decimal(bStr);
      tol = new Decimal(tolStr);
      if (!f(aInit).isFinite()) throw new Error('No finito');
    }catch(err){
      return null;
    }

    const fa0 = f(aInit), fb0 = f(bInit);
    const hayBracket = fa0.times(fb0).lessThan(0);

    const MAX_IT = 200;
    const filasBisec = hayBracket ? correrMetodo('bisec', f, aInit, bInit, tol, MAX_IT) : null;
    const filasFalsa = hayBracket ? correrMetodo('falsa', f, aInit, bInit, tol, MAX_IT) : null;
    const filasSecante = aInit.equals(bInit) ? null : correrSecante(f, aInit, bInit, tol, MAX_IT);

    let filasNewton = null;
    try{
      const fPrime = derivarFuncion(f);
      filasNewton = correrNewton(f, fPrime, aInit, tol, MAX_IT);
    }catch(err){ /* exponente no constante: Newton queda fuera de la comparación */ }

    let filasPF = null;
    try{
      const resultado = elegirPuntoFijoConvergente(f, aInit, tol, MAX_IT);
      if (resultado.convergio) filasPF = resultado.filas;
    }catch(err){ /* no se pudo despejar x automáticamente: Punto Fijo queda fuera de la comparación */ }

    const bisecConvergio = filasBisec && filasBisec[filasBisec.length-1].error !== null && filasBisec[filasBisec.length-1].error.lessThan(tol);
    const falsaConvergio = filasFalsa && filasFalsa[filasFalsa.length-1].error !== null && filasFalsa[filasFalsa.length-1].error.lessThan(tol);
    const secanteConvergio = filasSecante && !filasSecante[filasSecante.length-1].divergio && filasSecante[filasSecante.length-1].error !== null && filasSecante[filasSecante.length-1].error.lessThan(tol);
    const newtonConvergio = filasNewton && !filasNewton[filasNewton.length-1].divergio && filasNewton[filasNewton.length-1].error !== null && filasNewton[filasNewton.length-1].error.lessThan(tol);
    const pfConvergio = filasPF !== null;

    const itBisec = bisecConvergio ? filasBisec.length : null;
    const itFalsa = falsaConvergio ? filasFalsa.length : null;
    const itSecante = secanteConvergio ? filasSecante.length : null;
    const itNewton = newtonConvergio ? filasNewton.length : null;
    const itPF = pfConvergio ? filasPF.length : null;

    const candidatos = [];
    if (bisecConvergio) candidatos.push({ key: 'bisec', it: itBisec });
    if (falsaConvergio) candidatos.push({ key: 'falsa', it: itFalsa });
    if (secanteConvergio) candidatos.push({ key: 'secante', it: itSecante });
    if (newtonConvergio) candidatos.push({ key: 'newton', it: itNewton });
    if (pfConvergio) candidatos.push({ key: 'puntofijo', it: itPF });

    let ganadorKey = null;
    if (candidatos.length > 0){
      candidatos.sort((a, b) => a.it - b.it);
      ganadorKey = candidatos[0].key;
    }

    return {
      ganadorKey,
      iteraciones: { bisec: itBisec, falsa: itFalsa, secante: itSecante, newton: itNewton, puntofijo: itPF }
    };
  }

  function actualizarBadges(ganadorKey){
    document.getElementById('badgeBisec').classList.toggle('show', ganadorKey === 'bisec');
    document.getElementById('badgeFalsa').classList.toggle('show', ganadorKey === 'falsa');
    document.getElementById('badgeSecante').classList.toggle('show', ganadorKey === 'secante');
    document.getElementById('badgeNewton').classList.toggle('show', ganadorKey === 'newton');
    document.getElementById('badgePF').classList.toggle('show', ganadorKey === 'puntofijo');

  function actualizarContadores(iteraciones){
    const mapa = { bisec: 'iterBisec', falsa: 'iterFalsa', secante: 'iterSecante', newton: 'iterNewton', puntofijo: 'iterPF' };
    Object.entries(mapa).forEach(([key, id]) => {
      const n = iteraciones ? iteraciones[key] : null;
      document.getElementById(id).textContent = (n !== null && n !== undefined) ? '(' + n + ')' : '';
    });

  function actualizarTodo(){
    const info = calcularRecomendacion();
    if (!info){
      actualizarBadges(null);
      actualizarContadores(null);
      generarTabla();
      return;
    }
    actualizarBadges(info.ganadorKey);
    actualizarContadores(info.iteraciones);
    if (info.ganadorKey && info.ganadorKey !== metodoActual && !modoManual){
      cambiarMetodo(info.ganadorKey, true);
    } else {
      generarTabla();
    }
  }

  let debounceActualizacion = null;
  function programarActualizacion(){
    clearTimeout(debounceActualizacion);
    debounceActualizacion = setTimeout(actualizarTodo, 500);
  }

  // Vista previa en vivo: muestra f(x)/g(x) en formato matemático apenas se escribe,
  // sin esperar a que a/b/tol estén llenos ni a que la tabla se genere.
  function actualizarVistaPrevia(){
    const enPF = metodoActual === 'puntofijo';
    const exprRaw = document.getElementById('fx').value;
    const el = document.getElementById('fxDisplay');
    if (!exprRaw.trim()){
      el.innerHTML = '';
      return;
    }
    try{
      const tokens = tokenizar(prepararExpresion(exprRaw));
      const ast = construirAst(tokens); // valida que se pueda parsear por completo
      renderFormulaEnPanel(tokens, 'f(x) = ', 'fxDisplay');
      if (enPF){
        try{
          const candidatos = derivarPuntoFijoCandidatos(ast);
          el.innerHTML += ' <span style="opacity:.6">→</span> g(x) = ' + astAHtml(candidatos[0]);
        }catch(e){ /* no se pudo despejar automáticamente todavía; se deja solo f(x) */ }
      }
    }catch(err){
      // Expresión incompleta mientras se escribe (ej. "2*x^" a mitad de teclear): no se muestra nada nuevo,
      // se deja la última vista previa válida hasta que vuelva a completarse.
    }
  }

  function fraccion(numHtml, denHtml){
    return '<span class="frac"><span class="frac-num">' + numHtml + '</span><span class="frac-den">' + denHtml + '</span></span>';
  }

  function raiz(grado, contenidoHtml){
    const indice = (grado === 2) ? '' : '<sup class="raiz-indice">' + grado + '</sup>';
    return '<span class="raiz"><span class="raiz-marca">' + indice + '<span class="raiz-signo">√</span></span><span class="raiz-cont">' + contenidoHtml + '</span></span>';
  }

  const ETIQUETA = { a: 'a', b: 'b', fa: 'f(a)', fb: 'f(b)', xi: 'xᵢ', fxi: 'f(xᵢ)', error: 'E' };

  function etiquetaCampo(campo){
    if (metodoActual === 'newton'){
      const mapaNewton = { a: 'xᵢ', b: "f'(xᵢ)", fa: 'f(xᵢ)', fb: 'f(b)', xi: 'xᵢ₊₁', fxi: 'f(xᵢ₊₁)', error: 'E' };
      return mapaNewton[campo];
    }
    if (metodoActual === 'puntofijo'){
      const mapaPF = { a: 'xᵢ', b: 'b', fa: 'g(xᵢ)', fb: 'f(b)', xi: 'xᵢ₊₁', fxi: 'f(xᵢ)', error: 'E' };
      return mapaPF[campo];
    }
    const esSecante = metodoActual === 'secante';
    if (!esSecante) return ETIQUETA[campo];
    const mapaSecante = { a: 'x₀', b: 'x₁', fa: 'f(x₀)', fb: 'f(x₁)', xi: 'xᵢ', fxi: 'f(xᵢ)', error: 'E' };
    return mapaSecante[campo];
  }

  const SUBDIGITOS = { '0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉' };
  function aSubindice(n){
    return String(n).split('').map(d => SUBDIGITOS[d] !== undefined ? SUBDIGITOS[d] : d).join('');
  }

  const SUPERDIGITOS = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹' };
  function aSuperindice(n){
    return String(n).split('').map(d => SUPERDIGITOS[d] !== undefined ? SUPERDIGITOS[d] : d).join('');
  }

  function celdaId(campo, idx){
    const esSecante = metodoActual === 'secante';
    const esNewton = metodoActual === 'newton';
    const esPF = metodoActual === 'puntofijo';
    // x0/x1/f(x0)/f(x1) (secante) y xᵢ/f(xᵢ)/xᵢ₊₁/f(xᵢ₊₁) (newton/punto fijo) ya llevan
    // un subíndice propio — usamos superíndice para el número de fila, para no mezclar
    // dos subíndices juntos.
    const usaSuperindice =
      (esSecante && (campo === 'a' || campo === 'b' || campo === 'fa' || campo === 'fb')) ||
      (esNewton && (campo === 'a' || campo === 'b' || campo === 'fa' || campo === 'xi' || campo === 'fxi')) ||
      (esPF && (campo === 'a' || campo === 'fa' || campo === 'xi'));
    const sufijo = usaSuperindice ? aSuperindice(rows[idx].it) : aSubindice(rows[idx].it);
    return etiquetaCampo(campo) + sufijo;
  }
  function ref(campo, idxRef){ return refConEtiqueta(campo, idxRef, celdaId(campo, idxRef)); }

  function limpiarRelacionados(){

  function resaltarRelacionados(campo, idx){
    limpiarRelacionados();
    const rel = adjacency[nodeKey(campo, idx)];
    if (!rel) return;
    rel.forEach(otherKey => {
      const lastUnderscore = otherKey.lastIndexOf('_');
      const c = otherKey.substring(0, lastUnderscore);
      const i = otherKey.substring(lastUnderscore + 1);
      const td = document.querySelector('#resultTable td[data-campo="' + c + '"][data-idx="' + i + '"]');
      if (td){
        td.classList.add('related');
        td.style.outline = '2px solid ' + colorForCell(c, parseInt(i));
        td.style.background = bgForCell(c, parseInt(i), 0.22);

    const link = e.target.closest('.ref-link');
    if (link){ resaltarCelda(link.dataset.campo, parseInt(link.dataset.idx)); return; }
    const inputLink = e.target.closest('.input-link');
    if (inputLink){
      if (inputLink.dataset.tokidx !== undefined){
        resaltarTokenFormula(parseInt(inputLink.dataset.tokidx));
      } else {
        irAlInput(inputLink.dataset.input);
      }
    }
  });

  function celda(campo, idx){
    return '<td class="clickable col-' + campo + '" data-campo="' + campo + '" data-idx="' + idx + '">' + valorCelda(campo, idx) + '</td>';
  }

  function valorCelda(campo, idx){
    const r = rows[idx];
    switch(campo){
      case 'a': return fmtAnotado(r.a);
      case 'b': return fmtAnotado(r.b);
      case 'fa': return fmtAnotado(r.fa);
      case 'fb': return fmtAnotado(r.fb);
      case 'xi': return fmtAnotado(r.xi);
      case 'fxi': return fmtAnotado(r.fxi);
      case 'error': return r.error === null ? '—' : fmtAnotado(r.error);
    }
  }

  function mostrarExplicacionNewton(campo, idx){
    const r = rows[idx];
    const cellId = celdaId(campo, idx);
    const tag = 'Celda ' + cellId;
    let html = '';

    const aRef = ref('a', idx), bRef = ref('b', idx), faRef = ref('fa', idx);
    const xiRef = r.xi !== null ? ref('xi', idx) : null;
    const fxiRef = r.fxi !== null ? ref('fxi', idx) : null;
    const errRef = r.error !== null ? ref('error', idx) : null;
    const aPrevRef = idx > 0 ? ref('xi', idx - 1) : null;

    if (campo === 'a'){
      if (idx === 0){
        html = '<div class="formula">' + aRef + ' = ' + refInput('a', fmt(r.a)) + '</div><p>x₀ inicial.</p>';
      } else {
        html = '<div class="formula">' + aRef + ' = ' + aPrevRef + ' = ' + fmt(r.a) + '</div><p>Era xᵢ₊₁ anterior.</p>';
      }
    }
    else if (campo === 'fa'){
      const sust = formatearSustitucion(funcionActual.tokens, aRef);
      html = '<div class="formula">' + faRef + ' = f(' + aRef + ') = ' + sust + ' = ' + fmt(r.fa) + '</div>';
    }
    else if (campo === 'b'){
      const sustDeriv = formatearSustitucionAst(funcionDerivada.ast, fmt(r.a));
      html = '<div class="formula">' + bRef + " = f'(" + aRef + ') = ' + sustDeriv + ' = ' + fmt(r.b) + '</div>';
    }
    else if (campo === 'xi'){
      if (r.divergio){
        html = '<p class="empty">Sin xᵢ₊₁: f\'(' + aRef + ') = 0.</p>';
      } else {
        html = '<div class="formula">' + xiRef + ' = ' + aRef + ' − ' + fraccion(faRef, bRef) + ' = ' + fmt(r.xi) + '</div>' +
               '<p>Tangente en ' + aRef + ', corta el eje x.</p>';
      }
    }
    else if (campo === 'fxi'){
      if (r.divergio || r.fxi === null){
        html = '<p class="empty">Sin f(xᵢ₊₁).</p>';
      } else {
        const sust = formatearSustitucion(funcionActual.tokens, xiRef);
        html = '<div class="formula">' + fxiRef + ' = f(' + xiRef + ') = ' + sust + ' = ' + fmt(r.fxi) + '</div>';
      }
    }
    else if (campo === 'error'){
      if (r.error === null){
        html = '<p class="empty">Sin error todavía.</p>';
      } else {
        html = '<div class="formula">' + errRef + ' = |' + xiRef + ' − ' + aRef + '| = ' + fmt(r.error) + '</div>';
      }
    }

    document.getElementById('explainBox').innerHTML = '<span class="tag">' + tag + '</span>' + html;
  }

  function mostrarExplicacionPF(campo, idx){
    const r = rows[idx];
    const cellId = celdaId(campo, idx);
    const tag = 'Celda ' + cellId;
    let html = '';

    const aRef = ref('a', idx), faRef = ref('fa', idx);
    const errRef = r.error !== null ? ref('error', idx) : null;
    const aPrevRef = idx > 0 ? ref('fa', idx - 1) : null;

    if (campo === 'a'){
      if (idx === 0){
        html = '<div class="formula">' + aRef + ' = ' + refInput('a', fmt(r.a)) + '</div><p>x₀ inicial.</p>';
      } else {
        html = '<div class="formula">' + aRef + ' = ' + aPrevRef + ' = ' + fmt(r.a) + '</div><p>Era g(xᵢ) anterior.</p>';
      }
    }
    else if (campo === 'fa'){
      if (r.divergio){
        html = '<p class="empty">g(' + aRef + ') no es finito.</p>';
      } else {
        const sust = formatearSustitucionAst(funcionG.ast, fmt(r.a));
        html = '<div class="formula">' + faRef + ' = g(' + aRef + ') = ' + sust + ' = ' + fmt(r.fa) + '</div>';
      }
    }
    else if (campo === 'error'){
      if (r.error === null){
        html = '<p class="empty">Sin error todavía.</p>';
      } else {
        html = '<div class="formula">' + errRef + ' = |' + faRef + ' − ' + aRef + '| = ' + fmt(r.error) + '</div>';
      }
    }

    document.getElementById('explainBox').innerHTML = '<span class="tag">' + tag + '</span>' + html;
  }

  function mostrarExplicacion(campo, idx){
    if (metodoActual === 'newton'){ mostrarExplicacionNewton(campo, idx); return; }
    if (metodoActual === 'puntofijo'){ mostrarExplicacionPF(campo, idx); return; }

    const r = rows[idx];
    const cellId = celdaId(campo, idx);
    let tag = 'Celda ' + cellId;
    let html = '';
    const esSecante = metodoActual === 'secante';

    const aRef = ref('a', idx), bRef = ref('b', idx);
    const faRef = ref('fa', idx), fbRef = ref('fb', idx);
    const xiRef = r.xi !== null ? ref('xi', idx) : null;
    const fxiRef = r.fxi !== null ? ref('fxi', idx) : null;
    const errRef = r.error !== null ? ref('error', idx) : null;
    const xiPrevRef = idx > 0 ? ref('xi', idx - 1) : null;
    const aPrevRef = idx > 0 ? ref('a', idx - 1) : null;
    const bPrevRef = idx > 0 ? ref('b', idx - 1) : null;

    if (campo === 'a'){
      if (esSecante){
        if (r.cambioParaLlegarAqui === null){
          html = '<div class="formula">' + aRef + ' = ' + refInput('a', fmt(r.a)) + '</div><p>x₀ inicial.</p>';
        } else {
          html = '<div class="formula">' + aRef + ' = ' + bPrevRef + ' = ' + fmt(r.a) + '</div><p>Se desliza: era x₁.</p>';
        }
      } else if (r.cambioParaLlegarAqui === null){
        html = '<div class="formula">' + aRef + ' = ' + refInput('a', fmt(r.a)) + '</div><p>Extremo izquierdo inicial.</p>';
      } else if (r.cambioParaLlegarAqui === 'a'){
        html = '<div class="formula">' + aRef + ' = ' + xiPrevRef + ' = ' + fmt(r.a) + '</div><p>Raíz quedó en [xᵢ, b].</p>';
      } else {
        html = '<div class="formula">' + aRef + ' = ' + aPrevRef + ' = ' + fmt(r.a) + '</div><p>No cambió.</p>';
      }
    }
    else if (campo === 'b'){
      if (esSecante){
        if (r.cambioParaLlegarAqui === null){
          html = '<div class="formula">' + bRef + ' = ' + refInput('b', fmt(r.b)) + '</div><p>x₁ inicial.</p>';
        } else {
          html = '<div class="formula">' + bRef + ' = ' + xiPrevRef + ' = ' + fmt(r.b) + '</div><p>Era xᵢ de la fila anterior.</p>';
        }
      } else if (r.cambioParaLlegarAqui === null){
        html = '<div class="formula">' + bRef + ' = ' + refInput('b', fmt(r.b)) + '</div><p>Extremo derecho inicial.</p>';
      } else if (r.cambioParaLlegarAqui === 'b'){
        html = '<div class="formula">' + bRef + ' = ' + xiPrevRef + ' = ' + fmt(r.b) + '</div><p>Raíz quedó en [a, xᵢ].</p>';
      } else {
        html = '<div class="formula">' + bRef + ' = ' + bPrevRef + ' = ' + fmt(r.b) + '</div><p>No cambió.</p>';
      }
    }
    else if (campo === 'fa'){
      const sust = formatearSustitucion(funcionActual.tokens, aRef);
      html = '<div class="formula">' + faRef + ' = f(' + aRef + ') = ' + sust + ' = ' + fmt(r.fa) + '</div>';
    }
    else if (campo === 'fb'){
      const sust = formatearSustitucion(funcionActual.tokens, bRef);
      html = '<div class="formula">' + fbRef + ' = f(' + bRef + ') = ' + sust + ' = ' + fmt(r.fb) + '</div>';
    }
    else if (campo === 'xi'){
      if (r.divergio){
        html = '<p class="empty">Sin xᵢ: ' + faRef + ' = ' + fbRef + ' (división entre cero).</p>';
      } else if (esSecante){
        const numerador = '(' + bRef + ' − ' + aRef + ')·' + fbRef;
        const denominador = '(' + fbRef + ' − ' + faRef + ')';
        html = '<div class="formula">' + xiRef + ' = ' + bRef + ' − ' + fraccion(numerador, denominador) + ' = ' + fmt(r.xi) + '</div>' +
               '<p>Recta entre los dos puntos, corta el eje x.</p>';
      } else if (metodoActual === 'falsa'){
        const numerador = '(' + aRef + ' − ' + bRef + ')·' + faRef;
        const denominador = '(' + fbRef + ' − ' + faRef + ')';
        html = '<div class="formula">' + xiRef + ' = ' + aRef + ' + ' + fraccion(numerador, denominador) + ' = ' + fmt(r.xi) + '</div>' +
               '<p>Cuerda entre (a,f(a)) y (b,f(b)).</p>';
      } else {
        html = '<div class="formula">' + xiRef + ' = ' + fraccion(aRef + ' + ' + bRef, '2') + ' = ' + fmt(r.xi) + '</div><p>Punto medio del intervalo.</p>';
      }
    }
    else if (campo === 'fxi'){
      if (r.divergio || r.fxi === null){
        html = '<p class="empty">Sin f(xᵢ): no hubo xᵢ.</p>';
      } else if (esSecante){
        const sust = formatearSustitucion(funcionActual.tokens, xiRef);
        html = '<div class="formula">' + fxiRef + ' = f(' + xiRef + ') = ' + sust + ' = ' + fmt(r.fxi) + '</div><p>Nuevo x₁, sin comparar signos.</p>';
      } else {
        const sust = formatearSustitucion(funcionActual.tokens, xiRef);
        const signoTxt = r.producto.lessThan(0) ? 'negativo' : 'positivo';
        const decision = r.siguienteCambia === 'b' ? 'se reemplaza b' : 'se reemplaza a';
        html = '<div class="formula">' + fxiRef + ' = f(' + xiRef + ') = ' + sust + ' = ' + fmt(r.fxi) + '</div>' +
               '<p>' + faRef + '·' + fxiRef + ' es ' + signoTxt + ' → ' + decision + '.</p>';
      }
    }
    else if (campo === 'error'){
      if (r.error === null){
        html = '<p class="empty">Sin error todavía.</p>';
      } else if (esSecante){
        html = '<div class="formula">' + errRef + ' = |' + xiRef + ' − ' + bRef + '| = ' + fmt(r.error) + '</div>';
      } else {
        html = '<div class="formula">' + errRef + ' = |' + xiRef + ' − ' + xiPrevRef + '| = ' + fmt(r.error) + '</div>';
      }
    }

    document.getElementById('explainBox').innerHTML = '<span class="tag">' + tag + '</span>' + html;
  }

  window.onload = function(){
    ['fx', 'a', 'b', 'tol'].forEach(id => {
      document.getElementById(id).addEventListener('input', programarActualizacion);
    });
    document.getElementById('fx').addEventListener('input', actualizarVistaPrevia);
    document.getElementById('fx').addEventListener('input', () => { modoManual = false; });
    actualizarTodo();
  };
</script>
